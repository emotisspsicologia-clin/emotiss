<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'">
<meta name="referrer" content="no-referrer">
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiAGE | Sistema de Agendamento e Gestão Emotiss</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Work+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: cabeçalho + abas; gestão vê a semana em colunas, paciente vê cartões empilhados */
:root{
  --bg:#f1ece1; --surface:#ffffff; --surface-2:#f5f0e8; --line:#e3dccd;
  --fg:#17130f; --muted:#6b6358; --accent:#17130f; --accent-fg:#f5f0e8;
  --ok:#2f7d4f; --warn:#94600f; --bad:#a02a1c; --info:#2f5f9e;
  --warm:#b8573b; --gold:#e8c98f; --band:#17130f;
  --font-display:"Work Sans","Segoe UI",system-ui,sans-serif;
  --font-body:"Manrope","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14110e; --surface:#1f1b17; --surface-2:#2a2520; --line:#37312a;
    --fg:#f5f0e8; --muted:#a59d8d; --accent:#f5f0e8; --accent-fg:#17130f;
    --ok:#6cc48f; --warn:#e0a850; --bad:#ec8b82; --info:#8ab4ea;
    --warm:#e08a6c; --band:#1f1b17; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);padding:22px 16px 80px;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.app{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.7rem;letter-spacing:-.01em} h2{font-size:1.2rem} h3{font-size:.95rem}
p{margin:0}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.top .sub{color:var(--muted);font-size:.9rem;margin-top:2px}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 .92rem var(--font-body);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.tab:hover{color:var(--fg)}
.badge{background:var(--accent);color:var(--accent-fg);border-radius:99px;font-size:.72rem;padding:0 7px;min-width:20px;text-align:center;line-height:20px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{appearance:none;font:600 .88rem var(--font-body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.small{padding:4px 10px;font-size:.8rem}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.seg{display:flex;gap:6px}
.weeklabel{font-family:var(--font-display);font-size:1.05rem}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--muted);font-size:.9rem}
.stats b{color:var(--fg);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel-form{display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500;min-width:0}
label.f.wide{grid-column:1/-1}
label.f.check{flex-direction:row;align-items:flex-start;gap:8px;color:var(--fg);font-size:.88rem}
label.f.check input{width:auto;margin-top:3px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{min-height:76px;resize:vertical}
input[type=file]{padding:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.week{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:1000px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day header{display:flex;gap:8px;align-items:baseline}
.dw{text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--muted);font-weight:600}
.dn{font-family:var(--font-display);font-weight:700}
.none{color:var(--muted);font-size:.85rem}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sess{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg);min-width:0}
.sess .t{font-weight:600}
.sess .who{overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.agendada{color:var(--info)} .pill.confirmada{color:var(--ok)} .pill.realizada{color:var(--muted)}
.pill.faltou{color:var(--warn)} .pill.cancelada{color:var(--bad)}
.pill.nova{color:var(--accent)} .pill.tag{color:var(--muted);font-weight:500}
select.st{padding:3px 6px;font-size:.8rem;width:auto}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font:inherit;font-size:.85rem;font-weight:600;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.item.av.unread{border-color:var(--warm);box-shadow:inset 4px 0 0 var(--warm)}
.item.unread{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item h3{overflow-wrap:anywhere}
.item p.body{white-space:pre-wrap;overflow-wrap:anywhere}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);padding:2px 8px;border-radius:6px;font-size:.88rem;user-select:all}
a{color:var(--accent)}
a.file{font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--fg);font-family:var(--font-display);font-size:1.02rem;margin-bottom:2px}
.cols{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:900px){.cols.two{grid-template-columns:1fr 1fr}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;max-width:820px;margin:18px auto}
#toast{position:fixed;left:16px;right:16px;bottom:16px;display:flex;justify-content:center;pointer-events:none}
#toast span{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.gates{max-width:1000px}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.svc{appearance:none;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.svc:hover{border-color:var(--accent)}
.svc.sel{border:2px solid var(--accent);padding:13px;background:var(--surface-2)}
.svc strong{font-family:var(--font-display);font-size:1.02rem}
.svc .body{color:var(--muted);font-size:.88rem}
.svc .kv{font-size:.86rem}
.notice{border:2px solid var(--warm);background:var(--surface-2);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.notice .ttl{font-family:var(--font-display);font-weight:700;font-size:1.02rem;color:var(--warm)}
.ok-box{border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:10px 12px;font-weight:600}
.step{display:flex;flex-direction:column;gap:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dh{font-size:.72rem;color:var(--muted);text-align:center;font-weight:600}
.cal button{appearance:none;aspect-ratio:1;min-height:36px;border:1px solid transparent;border-radius:8px;background:none;color:var(--muted);font:inherit;opacity:.55}
.cal button.avail{background:var(--surface-2);color:var(--fg);border-color:var(--line);font-weight:600;cursor:pointer;opacity:1}
.cal button.avail:hover{border-color:var(--accent)}
.cal button.sel{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);opacity:1}
.cal button.today{text-decoration:underline}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.sum{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.cap{text-transform:capitalize}
details>summary{cursor:pointer;font-weight:600;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.big{grid-column:span 2;border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tile .tl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile b{font:700 1.35rem var(--font-display);overflow-wrap:anywhere}
.tile .ts{color:var(--muted);font-size:.85rem}
.top.pac{border-bottom:1px solid var(--line);padding-bottom:14px}
.top.pac h1{font-size:2.1rem}.nm{color:var(--accent)}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg)}
.cols{align-items:start}
.top.pac .code{font-size:.95rem}
.top.pac .sub{display:flex;gap:8px;align-items:center;margin-top:6px}
.nudge{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--accent);background:var(--surface-2);border-radius:10px;padding:12px 16px}
.busca{width:100%;font:inherit;padding:9px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--fg)}
.lista-rec .list{max-height:60vh;overflow:auto}
.fold{padding:12px 16px}.fold>summary{color:var(--fg);font-family:var(--font-display);font-size:1.05rem}
a.btn{text-decoration:none;display:inline-block}
.fv{display:grid;grid-template-columns:minmax(120px,230px) 1fr;gap:4px 14px;font-size:.88rem;border-top:1px solid var(--line);padding-top:8px}
.fv h4{grid-column:1/-1;margin:10px 0 0;font:700 .72rem var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.fv dt{color:var(--muted)}.fv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
@media (max-width:600px){.fv{grid-template-columns:1fr}.fv dd{margin-bottom:6px}}
.fx{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:14px}
.fx .f{margin:0 0 14px;min-width:0}
.fx .f>label,.fx .q{display:block;font-weight:600;font-size:.88rem;margin:0 0 7px}
.fx .req::after{content:' *';color:var(--bad)}
.fx input[type=text],.fx input[type=tel],.fx input[type=email],.fx select,.fx textarea{min-height:46px;border-radius:10px;padding:10px 12px}
.fx textarea{min-height:130px}
.fx input.valid{border-color:var(--ok)}
.fx .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px;align-items:stretch;justify-content:normal}
.fx .opts,.fx .yn{display:flex;flex-wrap:wrap;gap:8px}
.fx .opts.col{flex-direction:column}
.fx .o{position:relative;display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;flex:1 1 auto}
.fx .yn .o{flex:0 0 auto;min-width:84px;justify-content:center;font-weight:600}
.fx .o::before{content:'';width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none}
.fx .yn .o::before{display:none}
.fx .o input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;padding:0}
.fx .o:has(input:checked){border-color:var(--accent);background:var(--surface-2);font-weight:600}
.fx .o:has(input:checked)::before{border-color:var(--accent);background:radial-gradient(var(--accent) 42%,transparent 48%)}
.fx .yn .o:has(input:checked){background:var(--accent);color:var(--accent-fg)}
.fx .o:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.fx .chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:.88rem;cursor:pointer}
.fx .chk input{width:20px;height:20px;padding:0;flex:none;margin-top:2px;accent-color:var(--accent)}
.fx .sub,.fx .sub2{margin:10px 0 0;padding:12px 14px 2px;background:var(--surface-2);border-radius:10px}
.fx .hint{font-size:.8rem;color:var(--muted);margin:7px 0 0}
.fx .err{color:var(--bad);font-weight:600;font-size:.88rem;margin:8px 0 0}
.fx .bad,.fx .f.bad .o,.fx .f.bad .chk{border-color:var(--bad)!important}
.fx .btns{display:flex;gap:10px}.fx .btns .btn{flex:1;min-height:46px}
.fx .blk+.blk{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.fx .blk>h2{font-size:1rem;margin-bottom:12px}
.fx .lead{color:var(--muted);font-size:.88rem;margin:2px 0 14px}
.fx .t{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:8px}
.fx .pbar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.fx .pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.fx .dots{display:flex;justify-content:space-between;gap:4px;margin-top:10px;font-size:.72rem;color:var(--muted)}
.fx .dots span{flex:1;text-align:center}.fx .dots .on{color:var(--fg);font-weight:700}
.fx .nx{display:flex;gap:12px;align-items:flex-start;font-size:.92rem;margin-top:10px}
.fx .nx b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-size:.78rem;display:flex;align-items:center;justify-content:center}
.fx .soc{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Identidade Emotiss (proposta A) ===== */
body{padding:0 0 90px;font-family:var(--font-body)}
h1,h2,h3,.dn,.weeklabel,.tile b,.svc strong,.notice .ttl{font-family:var(--font-display);font-weight:600}
.app{max-width:none;margin:0;gap:0}
.top{display:block;background:var(--band);color:#f5f0e8;padding:26px 18px 70px;border-radius:0 0 34px 34px;border:0}
.top>.in{max-width:1080px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.top .eyebrow{color:var(--gold)}
.top h1{color:#f5f0e8;font-size:1.9rem}
.top .sub,.top .meta{color:#cdc5b6}
.top.pac{border-bottom:0;padding-bottom:70px}
.top.pac h1{font-size:2.2rem;color:#f5f0e8}
.nm{color:var(--gold)}
.top .code{background:none;border:1px solid #f5f0e855;color:#f5f0e8;letter-spacing:.08em}
.hdr{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.hdr .logo{height:54px;aspect-ratio:3.357;color:#f5f0e8;display:block}
.top .btn{background:none;color:#f5f0e8;border-color:#f5f0e866}
.top .btn:hover{border-color:var(--gold)}
.tabs{width:calc(100% - 32px);max-width:1048px;margin:-28px auto 18px;background:var(--surface);border:0;border-radius:99px;padding:6px;gap:4px;box-shadow:0 6px 20px #17130f2b;position:relative;z-index:2}
.tab{flex:1;justify-content:center;border:0;margin:0;border-radius:99px;padding:10px 16px}
.tab[aria-selected="true"],.tab[aria-selected="true"]:hover{background:var(--accent);color:var(--accent-fg)}
.badge{background:var(--warm);color:#fff}
.tabs[hidden]+main{margin-top:-34px}
main{display:block;max-width:1080px;width:100%;margin:0 auto;padding:0 16px;position:relative}
.card{border:0;border-radius:22px;box-shadow:0 4px 18px #17130f14}
.item,.day,.tile,.nudge,.notice,.empty{border-radius:18px}
.day.today{border-color:var(--warm);box-shadow:inset 0 3px 0 var(--warm)}
.btn,.sess{border-radius:12px}
/* toque quente: data em círculo e destaque terracota */
.tile.big{background:var(--warm);color:#fff;border:0;box-shadow:none}
.tile.big .tl,.tile.big .ts{color:#ffffffcc}
.item.sc{flex-direction:row;align-items:center;gap:14px}
.dbadge{flex:none;width:58px;height:58px;border-radius:50%;background:var(--surface-2);color:var(--warm);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dbadge b{font:700 1.35rem var(--font-display)}.dbadge small{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-top:2px}
.nudge{border-style:dashed;border-width:1.5px}
.cal button.today{text-decoration:none;box-shadow:inset 0 0 0 2px var(--warm)}
@media (max-width:640px){.top.pac h1{font-size:1.8rem}.hdr{align-items:flex-start}.hdr .logo{height:44px}.tab{padding:9px 12px}}

/* aceite em terracota */
.notice{box-shadow:inset 6px 0 0 var(--warm)}
.item.aceite{border-color:var(--warm);box-shadow:inset 4px 0 0 var(--warm)}
.pill.aceite-ok{color:var(--warm)}
h2.aceite-h{color:var(--warm)}
.notice input[type=checkbox]{accent-color:var(--warm)}
/* checkbox visível, na paleta */
label.f.check input[type=checkbox],.fx .chk input[type=checkbox]{flex:none;width:24px;height:24px;min-width:24px;padding:0;margin:0;accent-color:var(--warm);cursor:pointer;border-radius:6px}
label.f.check{align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--warm);border-radius:14px;background:var(--surface-2);line-height:1.4}
label.f.check span{flex:1;min-width:0}
/* código no topo em pílula destacada */
.top .code,.top.pac .code{display:inline-block;background:var(--gold);color:#17130f;border:0;border-radius:999px;padding:2px 11px;font-size:.78rem;line-height:1.5;font-weight:700;letter-spacing:.06em;box-shadow:none}
/* profissionais, filtros e agenda por profissional */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{appearance:none;font:600 .8rem var(--font-body);padding:5px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center}
.chip .dot{margin-right:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.filters{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:0 2px 10px #17130f10}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.frow>.eyebrow{min-width:88px}
.sess{border-left:4px solid var(--c,var(--line))}
.pchip{display:inline-flex;align-items:center;font-size:.74rem;font-weight:700;color:var(--c)}
.wins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.win{border:1.5px dashed var(--c);border-radius:10px;padding:3px 8px;font-size:.74rem;background:color-mix(in srgb,var(--c) 10%,transparent);display:flex;flex-direction:column;min-width:0;overflow-wrap:anywhere;gap:2px}
.win b{font-weight:700}
.win .btn.small{align-self:flex-start;padding:1px 8px;font-size:.7rem}
.day header .add{margin-left:auto;padding:0 9px;line-height:1.5}
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--warm)}
.prof{display:flex;gap:14px;align-items:flex-start;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.pill.cancelamento{color:var(--bad)}.pill.agendamento{color:var(--ok)}.pill.solicitacao{color:var(--warm)}
.pedido>summary{font-size:.82rem;color:var(--warm)}
/* trilha de agendamento */
.trail{list-style:none;margin:0;padding:0;display:flex}
.trail li{flex:1;position:relative;text-align:center;font-size:.82rem;font-weight:600;color:var(--muted)}
.trail li::before{content:'';position:absolute;top:16px;left:-50%;width:100%;height:2px;background:var(--line)}
.trail li:first-child::before{display:none}
.trail li.done::before,.trail li.cur::before{background:var(--warm)}
.trail li.cur,.trail li.done{color:var(--fg)}
.trail .tl-in,.trail button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit}
.trail button{cursor:pointer}
.trail .n{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font:700 .9rem var(--font-display)}
.trail li.cur .n{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.trail li.done .n{background:var(--warm);border-color:var(--warm);color:#fff}
.guide{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:.92rem;border-left:4px solid var(--warm)}
.guide b{color:var(--warm)}
.wiz-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px}
.pillb{border-radius:999px!important;min-height:44px;padding:9px 22px}
.pillb.small{min-height:36px;padding:5px 16px}
.wiz-nav .btn.primary{box-shadow:0 6px 16px #17130f33}
.pillb[disabled]{box-shadow:none!important}
.resumo{grid-template-columns:minmax(110px,180px) 1fr}
/* login: abas do paciente e botões em pílula flutuante */
.pform{flex:1}
.ptabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:#17130f14}
.ptabs button{flex:1;appearance:none;border:0;border-radius:999px;padding:9px 12px;font:600 .88rem var(--font-body);background:none;color:#4a4236;cursor:pointer}
.ptabs button[aria-selected="true"]{background:#17130f;color:#f5f0e8;box-shadow:0 3px 10px #17130f40}
.gates .actions{flex-direction:column;align-items:stretch;gap:10px;padding-top:6px}
.gates .actions .btn{border-radius:999px;min-height:46px;padding:11px 22px;font-size:.95rem;box-shadow:0 6px 16px #17130f33;transition:transform .15s,box-shadow .15s}
.gates .actions .btn:hover{transform:translateY(-1px);box-shadow:0 9px 20px #17130f40}
.gates .actions .btn.small{min-height:40px;font-size:.85rem;box-shadow:none;background:transparent;border:1.5px solid currentColor;color:inherit}
.gates .hl .actions .btn.small{color:#4a4236}
/* login: paciente em destaque, gestão alinhada */
.gates{max-width:none;margin:0;gap:16px;align-items:stretch}
@media (min-width:900px){.gates{grid-template-columns:1.5fr 1fr}}
.gates .card .actions{margin-top:auto}
.gates .card .eyebrow{margin-bottom:-6px}
.gates .hl{background:var(--band);color:#f5f0e8;box-shadow:0 10px 30px #17130f40,inset 0 4px 0 var(--warm)}
.gates .hl .eyebrow{color:var(--gold)}
.gates .hl h2{color:#f5f0e8;font-size:1.4rem}
.gates .hl .meta,.gates .hl label.f{color:#cdc5b6}
.gates .hl input{background:#ffffff14;border-color:#f5f0e855;color:#f5f0e8}
.gates .hl .btn.primary{background:#f5f0e8;color:#17130f;border-color:#f5f0e8}
/* data da sessão: quadrado arredondado terracota */
.dbadge{border-radius:16px}

/* destaque do paciente em terracota */
.gates .hl{background:#b8573b;color:#fff;box-shadow:0 10px 30px #b8573b55}
.gates .hl .eyebrow{color:#ffe9c9}
.gates .hl h2{color:#fff}
.gates .hl .meta,.gates .hl label.f{color:#ffffffe0}
.gates .hl input{background:#ffffff26;border-color:#ffffff80;color:#fff}
.gates .hl input::placeholder{color:#ffffffb3}
.gates .hl .btn.primary{background:#fff;color:#8f3f27;border-color:#fff}

/* destaque do paciente em #d8a24a (texto escuro para contraste) */
.gates .hl{background:#d8a24a;color:#17130f;box-shadow:0 10px 30px #d8a24a66}
.gates .hl .eyebrow{color:#5a3c0f}
.gates .hl h2{color:#17130f}
.gates .hl .meta,.gates .hl label.f{color:#3b2a0c}
.gates .hl input{background:#ffffff59;border-color:#17130f55;color:#17130f}
.gates .hl input::placeholder{color:#17130fb3}
.gates .hl .btn.primary{background:#17130f;color:#f5f0e8;border-color:#17130f}

/* destaque do paciente: creme #f4efe5 levemente escurecido para se destacar do fundo */
.gates .hl{background:#ebe2d0;color:#17130f;border:1.5px solid #d3c4a5;box-shadow:0 10px 26px #17130f26,inset 0 4px 0 #b8573b}
.gates .hl .eyebrow{color:#8f3f27}
.gates .hl h2{color:#17130f}
.gates .hl .meta,.gates .hl label.f{color:#4a4236}
.gates .hl input{background:#fff;border-color:#c9b995;color:#17130f}
.gates .hl input::placeholder{color:#8b8274}
.gates .hl .btn.primary{background:#17130f;color:#f5f0e8;border-color:#17130f}

/* bloqueio de novo agendamento e orientação de contrato */
.lock-box{display:flex;gap:14px;align-items:flex-start;background:var(--surface-2);border-radius:16px;padding:16px}
.lock-ic{font-size:1.6rem;line-height:1}
.cb{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:16px;box-shadow:0 2px 10px rgba(23,19,15,.05)}
.cb h3{margin:0}.cb-val{font-family:'Work Sans',sans-serif;font-weight:800;font-size:1.35rem;white-space:nowrap}
.cb .sx-badge{align-self:flex-start}
.cb-pay{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.cb-qr{background:#fff;border-radius:14px;padding:8px;border:1px solid var(--line);line-height:0;flex:0 0 auto}
.cb-qr svg{width:176px;height:176px}
.cb-code{width:100%;font:.74rem/1.35 ui-monospace,Menlo,monospace;word-break:break-all;resize:none}
.cb-up{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.govbr{background:color-mix(in srgb,var(--warm) 10%,var(--surface));border-left:4px solid var(--warm);border-radius:10px;padding:10px 12px;font-size:.88rem}

/* login da gestão */
.gates .gestao{gap:12px}
.g-top{display:flex;align-items:center;gap:14px}
.g-top h2{margin:0}
.g-ic{width:48px;height:48px;border-radius:14px;background:var(--band);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.pw{position:relative}
.pw input{padding-right:84px}
.pw-ver{position:absolute;right:8px;bottom:8px;font:inherit;font-size:.8rem;font-weight:600;background:var(--surface-2);color:var(--fg);border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.gestao .actions .btn{width:100%;justify-content:center;padding:12px}
.g-foot{margin:2px 0 0;text-align:center;font-size:.76rem;color:var(--muted)}

/* login da gestão: respiro e alinhamento */
.gates .gestao{gap:18px;padding:24px 22px}
.gates .gestao .g-top{gap:16px}
.gates .gestao .eyebrow{margin:0 0 4px;line-height:1.2}
.gates .gestao h2{line-height:1.2}
.gates .gestao>.meta{margin:0;line-height:1.55}
.gates .gestao .pw label,.gates .gestao .pw .f>span:first-child{display:block;margin-bottom:8px}
.gates .gestao .pw input{min-height:48px}
.gates .gestao .pw-ver{bottom:7px}
.gates .gestao>.meta:empty{display:none}
.gates .gestao .actions{margin-top:4px}
.gates .gestao .g-foot{margin:4px 0 0;padding-top:14px;border-top:1px solid var(--line)}

/* sistema de cores por situação */
.st-agendada{--sc:#2f5f9e}.st-confirmada{--sc:#2f7d4f}.st-cancelada{--sc:#a02a1c}.st-reagendada{--sc:#9a6b00}.st-realizada{--sc:#6b6358}.st-faltou{--sc:#b45a14}.st-geral{--sc:#17130f}
.pill.reagendada{color:#9a6b00}
@media (prefers-color-scheme: dark){.st-agendada{--sc:#8ab4ea}.st-confirmada{--sc:#6cc48f}.st-cancelada{--sc:#ec8b82}.st-reagendada{--sc:#e0b34a}.st-realizada{--sc:#a59d8d}.st-faltou{--sc:#f0a060}.st-geral{--sc:#e8c98f}}
/* avisos */
.nt-head{padding:0 2px}.nt-head h2{margin:0 0 4px}
.nt-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.nt-tab{font:inherit;font-size:.86rem;font-weight:600;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.nt-tab.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.nt-n{background:var(--warm);color:#fff;font-size:.68rem;font-weight:700;min-width:20px;height:20px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.nt-list{display:flex;flex-direction:column;gap:12px}
.nt{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc,var(--line));border-radius:14px;box-shadow:0 2px 10px #17130f0d}
.nt.novo{background:color-mix(in srgb,var(--sc) 7%,var(--surface))}
.nt-ic{width:48px;height:48px;border-radius:12px;background:color-mix(in srgb,var(--sc) 14%,var(--surface));color:var(--sc);display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700}
.st-geral .nt-ic{background:var(--band);color:var(--gold)}
.nt-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.nt-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.74rem}
.nt-tipo{color:var(--sc);font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.nt-new{background:var(--sc);color:#fff;font-weight:700;border-radius:6px;padding:1px 8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
.nt-when{margin-left:auto;color:var(--muted)}
.nt h3{font-size:1.02rem;margin:0;font-weight:700;color:var(--fg)}
.nt-txt{margin:0;font-size:.93rem;line-height:1.5;font-weight:400;color:color-mix(in srgb,var(--fg) 82%,var(--surface))}
/* sessões do paciente */
.sx{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:16px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--sc);border-radius:16px;box-shadow:0 2px 10px #17130f0d}
.sx-date{width:64px;height:68px;border-radius:14px;background:color-mix(in srgb,var(--sc) 13%,var(--surface));color:var(--sc);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sx-date b{font:700 1.7rem var(--font-display)}.sx-date small{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-top:4px}
.sx-main{min-width:0;display:flex;flex-direction:column;gap:8px}
.sx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sx-top h3{margin:0;font-size:1.05rem}
.sx-badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,var(--surface));border-radius:8px;padding:4px 10px}
.sx-ck{font-style:normal;color:#2f7d4f;font-weight:800}
.sx-time{margin:0;font-weight:600;font-size:.95rem}
.sx-tags{display:flex;flex-wrap:wrap;gap:6px}
.sx-tags span{font-size:.8rem;background:var(--surface-2);border-radius:8px;padding:3px 10px;color:var(--fg)}
.sx.st-cancelada .sx-top h3,.sx.st-cancelada .sx-time{text-decoration:line-through;opacity:.7}
.bk-head{align-items:center}
/* contrato */
.ctr{border-left:6px solid var(--warm)}
.ctr.pend{border-left-color:#9a6b00;background:color-mix(in srgb,#9a6b00 5%,var(--surface))}
.ctr.ok{border-left-color:#2f7d4f;background:color-mix(in srgb,#2f7d4f 8%,var(--surface))}
.ctr-badge{font-size:.78rem;font-weight:700;border-radius:8px;padding:4px 10px;background:color-mix(in srgb,#9a6b00 15%,var(--surface));color:#9a6b00}
.ctr.ok .ctr-badge{background:#2f7d4f;color:#fff}
.ctr-msg{margin:0;color:#2f7d4f;font-weight:600}
.ctr-up{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:560px){.sx{grid-template-columns:52px 1fr;gap:12px}.sx-date{width:52px;height:58px}.sx-date b{font-size:1.4rem}}

/* WhatsApp e recepção */
.btn.wa{background:#1f8a4c;color:#fff;border-color:#1f8a4c;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.wa::before{content:'💬'}
.top .btn.wa{background:none;color:#f5f0e8;border-color:#f5f0e866}
.wa-bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* trilha: linha entre os números, sem cruzar o círculo */
.trail li::before{left:calc(-50% + 24px);width:calc(100% - 48px);top:16px;z-index:0}
.trail .tl-in,.trail button{z-index:1}
.trail .n{position:relative;z-index:1}
.trail .tn{line-height:1.2;max-width:100%}
@media (max-width:480px){.trail li{font-size:.72rem}.trail .n{width:30px;height:30px}.trail li::before{top:14px;left:calc(-50% + 20px);width:calc(100% - 40px)}}
.lock-box{display:flex;gap:14px;align-items:flex-start;background:var(--surface-2);border-radius:16px;padding:16px}
.lock-ic{font-size:1.6rem;line-height:1}
/* agenda da gestão */
.week.wk-lista{display:flex;flex-direction:column;gap:14px}
.week.wk-cols{display:grid;grid-template-columns:repeat(7,minmax(250px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.dia2{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 2px 10px #17130f0d}
.dia2.today{border-color:var(--warm);box-shadow:inset 0 4px 0 var(--warm),0 2px 10px #17130f0d}
.dia2.past{opacity:.78}
.dia2.vazio{padding:10px 16px;background:transparent;box-shadow:none;border-style:dashed}
.dia2 header{display:flex;align-items:center;gap:14px}
.dia2-d{width:52px;height:52px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.dia2.today .dia2-d{background:var(--warm);color:#fff}
.dia2.vazio .dia2-d{width:40px;height:40px}.dia2.vazio .dia2-d b{font-size:1rem}
.dia2-d b{font:700 1.35rem var(--font-display)}.dia2-d small{font-size:.64rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-top:3px}
.dia2-t{display:flex;flex-direction:column;gap:2px;min-width:0}.dia2-t strong{font-family:var(--font-display);font-size:1.02rem;text-transform:capitalize}
.dia2 header .add{margin-left:auto}
.wins.row{flex-direction:row;flex-wrap:wrap;gap:8px}
.wins.row .win{flex-direction:row;gap:8px;align-items:center;padding:4px 10px}
.ag2-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.wk-cols .ag2-grid{grid-template-columns:1fr}
.ag2{display:grid;grid-template-columns:70px 1fr;gap:14px;background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:14px;padding:12px 14px;min-width:0}
.ag2-time{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:color-mix(in srgb,var(--sc,#6b6358) 14%,var(--surface));color:var(--sc,var(--fg));padding:8px 0;align-self:start;line-height:1.1}
.ag2-time b{font:700 1.25rem var(--font-display)}.ag2-time small{font-size:.7rem;font-weight:600;margin-top:3px}
.ag2-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.ag2-who{font:700 1.08rem var(--font-display);color:var(--fg);overflow-wrap:anywhere;line-height:1.25}
.ag2-meta{font-size:.86rem;color:color-mix(in srgb,var(--fg) 75%,var(--surface))}
.ag2-chips{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ag2-tag{font-size:.72rem;font-weight:700;background:var(--surface-2);border-radius:7px;padding:2px 8px}.ag2-tag.aviso{background:color-mix(in srgb,#9a6b00 14%,var(--surface));color:#9a6b00}
.ag2-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.ag2-foot select.st{border:1.5px solid var(--sc,var(--line));color:var(--sc,var(--fg));font-weight:700;border-radius:10px;padding:5px 8px;background:var(--surface)}
@media (max-width:560px){.ag2{grid-template-columns:58px 1fr;gap:10px}.ag2-grid{grid-template-columns:1fr}}

}

function diasDesde(iso){var d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);return d<=0?'hoje':(d===1?'há 1 dia':'há '+d+' dias')}
function itensRecepcao(){
  var out=[],ag=S.d.agenda||[],mats=S.d.materiais||[],msgs=S.d.mensagens||[],fichas=S.d.fichas||[];
  (S.d.pacientes||[]).forEach(function(p){
    var viva=ag.some(function(a){return a.codigo===p.codigo&&a.status!=='cancelada'});
    var fi=fichas.filter(function(x){return x.codigo===p.codigo})[0];
    var contratos=mats.filter(function(m){return m.categoria==='contrato'&&m.para===p.codigo});
    var aceite=ag.some(function(a){return a.codigo===p.codigo&&a.aceiteEm&&a.status!=='cancelada'});
    var pendAss=contratos.filter(function(m){return !msgs.some(function(x){return x.codigo===p.codigo&&String(x.mensagem||'').indexOf('[contrato:'+m.id+']')>=0})});
    if(!viva&&fi)out.push({p:p,k:'ficha',ordem:1,tit:'Ficha recebida, sem agendamento',desde:fi.criadoEm||p.criadoEm,tpl:'ficha',cor:'agendada'});
    if(!viva&&!fi)out.push({p:p,k:'semficha',ordem:4,tit:'Cadastro sem ficha e sem agendamento',desde:p.criadoEm,tpl:'semficha',cor:'realizada'});
    if(aceite&&!contratos.length)out.push({p:p,k:'contrato',ordem:2,tit:'Agendou: contrato a enviar',desde:p.criadoEm,tpl:null,cor:'reagendada'});
    if(pendAss.length)out.push({p:p,k:'assinatura',ordem:3,tit:'Contrato enviado, aguardando assinatura',desde:pendAss[0].criadoEm,tpl:'assinatura',cor:'reagendada'});
  });
  return out.sort(function(a,b){return a.ordem-b.ordem||(a.desde||'').localeCompare(b.desde||'')});
}

var AV_TIPOS=[['todos','Todos'],['sessao','Sessões'],['documento','Documentos'],['contrato','Contrato'],['pagamento','Pagamentos'],['material','Materiais'],['ficha','Ficha'],['geral','Comunicados']];

function stAviso(a){
  if(a.tipo==='pagamento'){var tp=((a.titulo||'')+'').toLowerCase();return /confirmado/.test(tp)?'confirmada':/cancelad|não aceito/.test(tp)?'cancelada':'reagendada'}
  if(a.tipo!=='sessao'){return ({documento:'confirmada',contrato:'reagendada',material:'agendada',ficha:'realizada',geral:'geral'})[a.tipo]||'realizada'}
  var t=((a.titulo||'')+' '+(a.mensagem||'')).toLowerCase();
  if(/reagendad/.test(t))return 'reagendada';
  if(/cancelad|removid|encerrad/.test(t))return 'cancelada';
  if(/confirmad/.test(t))return 'confirmada';
  if(/realizad/.test(t))return 'realizada';
  if(/faltou|como falta/.test(t))return 'faltou';
  return 'agendada';
}

function reduzirFoto(f){
  return new Promise(function(ok,fail){
    if(!f||!/^image\//.test(f.type))return fail(new Error('Escolha um arquivo de imagem.'));
    var r=new FileReader();r.onerror=function(){fail(new Error('Não foi possível ler a imagem.'))};
    r.onload=function(){
      var img=new Image();img.onerror=function(){fail(new Error('Imagem inválida.'))};
      img.onload=function(){
        var w=240,c=document.createElement('canvas');c.width=c.height=w;var x=c.getContext('2d');
        var m=Math.min(img.width,img.height),sx=(img.width-m)/2,sy=(img.height-m)/2;
        x.fillStyle='#fff';x.fillRect(0,0,w,w);x.drawImage(img,sx,sy,m,m,0,0,w,w);
        var q=.8,u=c.toDataURL('image/jpeg',q);
        while(u.length>44000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q)}
        if(u.length>44000)fail(new Error('Imagem muito detalhada. Tente outra.'));else ok(u);
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  });
}

/* Gerador de QR Code (modo byte, correção M, versões 1–12). Sem dependências externas. */
var QR=(function(){

  function mul(a,b){return a&&b?EXP[LOG[a]+LOG[b]]:0}
  function gen(n){var g=[1];for(var i=0;i<n;i++){var ng=new Array(g.length+1).fill(0);for(var j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i])}g=ng}return g}
  function rs(data,n){var g=gen(n),r=new Array(n).fill(0);
    data.forEach(function(d){var f=d^r[0];r.shift();r.push(0);for(var i=0;i<n;i++)r[i]^=mul(g[i+1],f)});return r}
  function utf8(s){return Array.prototype.slice.call(unescape(encodeURIComponent(s))).map(function(c){return c.charCodeAt(0)})}
  function bch(v,poly,bits){var d=v<<bits;var top=0;for(var t=poly;t>1;t>>=1)top++;for(var i=top+bits-top;;){break}
    var pl=poly.toString(2).length;for(var k=d.toString(2).length-pl;k>=0;k--){if((d>>(k+pl-1))&1)d^=poly<<k}return d}
  function make(text){
    var bytes=utf8(text),ver=0;
    for(var v=1;v<=12;v++){var e=EC[v],cap=e[1]*e[2]+e[3]*e[4];var need=4+(v<10?8:16)+bytes.length*8;if(Math.ceil(need/8)<=cap){ver=v;break}}
    if(!ver)throw new Error('Texto longo demais para o QR.');
    var e=EC[ver],total=e[1]*e[2]+e[3]*e[4],bits=[];
    function put(val,n){for(var i=n-1;i>=0;i--)bits.push((val>>i)&1)}
    put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(function(b){put(b,8)});
    for(var i=0;i<4&&bits.length<total*8;i++)bits.push(0);

    var cw=[];for(i=0;i<bits.length;i+=8){var b=0;for(var j=0;j<8;j++)b=b*2+bits[i+j];cw.push(b)}

function ctIniciais(nome){
  return String(nome||'').replace(/\([^)]*\)/g,' ').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().split(/\s+/).filter(function(w){return w&&!/^(d[aeo]s?|e)$/.test(w)})
    .map(function(w){var m=/[a-z]/.exec(w);return m?m[0].toUpperCase():''}).join('').slice(0,8);
}
function ctMascData(v){var d=String(v).replace(/\D/g,'').slice(0,8);return d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d}
function ctNomeArq(t){return String(t).replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim()}
function fichaDoPac(cod){
  var f=(S.d.fichas||[]).filter(function(x){return x.codigo===cod})[0];if(!f)return null;
  try{return JSON.parse(f.dados)}catch(e){return null}
}

function atualizaCod(){
  var f=P.ct,pac=pacDoCt();if(!pac)return;
  var fi=fichaDoPac(pac.codigo)||{};var nasc=String(fi.nascimento||'').replace(/\//g,'.');
  var neu=f.sv[1].checked&&!f.sv[0].checked;
  if(!nasc){return}
  var atual=f.cod.value.trim(),seq=(/\/(\d{1,6})$/.exec(atual)||[])[1]||'0001';
  f.cod.value=ctIniciais(fi.paciente||pac.nome)+'.'+(neu?'Neur':'Psic')+'-'+nasc+'/'+seq;
}
function pacDoCt(){var c=P.ct&&P.ct.pac.value;return c?S.d.pacientes.filter(function(p){return p.codigo===c})[0]:null}
function profDoCt(){var n=P.ct&&P.ct.prof.value;return n?profs().filter(function(p){return p.nome===n})[0]:null}
/* ponte: ficha + cadastro + agenda + profissional (Pix) -> campos do contrato */
function preencherContrato(trocouPac){
  var f=P.ct,pac=pacDoCt(),pr=profDoCt();
  if(trocouPac&&pac){
    var fi=fichaDoPac(pac.codigo);
    f.ficha.hidden=!!fi;f.ficha.textContent=fi?'':'Este paciente ainda não enviou a ficha. Os dados abaixo precisam ser digitados e a data de nascimento é necessária para criar a pasta no Drive.';
    fi=fi||{};
    f.nome.value=fi.paciente||pac.nome||'';f.cpf.value=fi.cpf||'';f.tel.value=fi.telefone||pac.telefone||'';f.email.value=fi.email||pac.email||'';
    f.civil.value=CT_CIVIL.indexOf(fi.estado_civil)>=0?fi.estado_civil:'';f.end.value=ctEndereco(fi);
    var men=/menor/i.test(String(fi.titular||''));f.menor.checked=men;f.menorBox.hidden=!men;f.resp.value=men?(fi.resp_nome||''):'';f.respcpf.value=men?(fi.resp_cpf||''):'';
    var sv=String(fi.servico||'');f.sv[0].checked=/psicoter/i.test(sv);f.sv[1].checked=/neuro/i.test(sv);
    var md=String(fi.modalidade||'');f.md[0].checked=/presencial/i.test(md);f.md[1].checked=/online/i.test(md);
    f.cod.value='';atualizaCod();
    if(!f.data.value)f.data.value=ctMascData(todayKey.split('-').reverse().join(''));
    // dia e horário: da sessão mais recente/próxima do paciente (agenda)
    var ses=S.d.agenda.filter(function(a){return a.codigo===pac.codigo&&a.status!=='cancelada'}).sort(function(a,b){return (b.data+b.hora).localeCompare(a.data+a.hora)});
    var prox=ses.filter(function(a){return a.data>=todayKey}).sort(function(a,b){return (a.data+a.hora).localeCompare(b.data+b.hora)})[0]||ses[0];
    if(prox){var d=new Date(prox.data+'T12:00:00');f.diasem.value=CT_DIAS[(d.getDay()+6)%7];f.hora.value=prox.hora;
      if(!pr&&prox.profissional)f.prof.value=prox.profissional;
      if(prox.modalidade==='Online'&&!f.md[0].checked&&!f.md[1].checked)f.md[1].checked=true;}
    pr=profDoCt();
  }
  if(pr){
    if(pr.pixChave&&!f.pix.value)f.pix.value=pr.pixChave;
    if(!f.forma.value)f.forma.value=pr.pixChave?'Pix':'';
  }
}
function dadosContrato(){
  var f=P.ct,pac=pacDoCt(),pr=profDoCt();
  if(!pac)throw new Error('Escolha o paciente.');
  if(!pr)throw new Error('Escolha o profissional que assina como contratado.');
  if(!pr.crp)throw new Error('Cadastre o CRP de '+pr.nome+' na aba Profissionais (formato 04/85394). Ele aparece no contrato.');
  if(!f.nome.value.trim())throw new Error('Informe o nome do contratante.');
  if(!/^\d{2}\/\d{2}\/\d{4}$/.test(f.data.value.trim()))throw new Error('Informe a data do contrato (dd/mm/aaaa).');
  var sv=f.sv.filter(function(c){return c.checked}).map(function(c){return c.value}),md=f.md.filter(function(c){return c.checked}).map(function(c){return c.value});
  if(!sv.length)throw new Error('Marque o serviço contratado.');
  if(!md.length)throw new Error('Marque a modalidade de atendimento.');
  if(!/^(\d{1,3}(\.\d{3})*(,\d{1,2})?|\d{1,5}([.,]\d{1,2})?)$/.test(f.valor.value.trim()))throw new Error('Informe o valor por sessão (ex.: 150,00).');
  if(!f.forma.value)throw new Error('Escolha a forma de pagamento.');
  var q=f.qd.filter(function(r){return r.checked})[0];if(!q)throw new Error('Marque quando o pagamento é feito.');
  if(q.value==='dia'&&!f.dia.value.trim())throw new Error('Informe o dia do mês do pagamento.');
  if(f.menor.checked&&!f.resp.value.trim())throw new Error('Informe o responsável do menor.');
  var partes=pr.nome.trim().split(/\s+/);
  var d={paciente:f.nome.value.trim(),cpf:f.cpf.value.trim(),telefone:f.tel.value.trim(),email:f.email.value.trim(),estado_civil:f.civil.value,ct_nac:f.nac.value.trim(),ct_end:f.end.value.trim(),
    ct_data:f.data.value.trim(),prontuario:f.cod.value.trim(),ct_menor:f.menor.checked?'SIM':'',ct_resp:f.resp.value.trim(),ct_resp_cpf:f.respcpf.value.trim(),
    ct_serv:sv,ct_mod:md,ct_aval:f.aval.value.trim(),ct_local:f.local.value.trim(),ct_link:f.link.value.trim(),ct_valor:f.valor.value.trim(),ct_forma:f.forma.value,
    ct_pix:f.pix.value.trim(),ct_conta:f.conta.value.trim(),ct_quando:q.value,ct_dia:f.dia.value.trim(),ct_diasem:f.diasem.value,ct_hora:f.hora.value.trim(),
    profissional:pr.nome,__prof:{nome:pr.nome,curto:partes.length>1?partes[0]+' '+partes[partes.length-1]:partes[0],crpn:pr.crp,crpe:pr.crp.replace('/','—')}};
  return {d:d,pac:pac,prof:pr};
}
function bufB64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
async function acaoContrato(modo){
  var f=P.ct;f.msg.textContent='';
  var bs=[f.bPrev,f.bDown,f.bSave];bs.forEach(function(b){b.disabled=true});
  try{
    var r=dadosContrato();
    f.msg.textContent='Preparando o PDF…';await carregarPdf();
    var C=window.SiageContrato;
    C.setProfs(profs().filter(function(p){return p.ativo!=='nao'&&p.crp}).map(function(p){var pt=p.nome.trim().split(/\s+/);return {id:p.id,nome:p.nome,curto:pt.length>1?pt[0]+' '+pt[pt.length-1]:pt[0],crpn:p.crp,crpe:p.crp.replace('/','—')}}));
    var now=new Date(),J=window.jspdf.jsPDF;
    var base=ctNomeArq('Contrato - '+r.d.paciente.slice(0,70)+' - '+(C.codigoDoc(r.d.prontuario,'C')||'sem codigo').replace(/\//g,'_'));
    var n1=base+' - 1ª via paciente.pdf',n2=base+' - 2ª via contratado.pdf';
    if(modo==='prev'){
      var url=URL.createObjectURL(C.build(J,r.d,now,'paciente').output('blob'));
      var w=window.open(url,'_blank');if(!w)f.msg.textContent='O navegador bloqueou a nova aba. Permita pop-ups ou use "Baixar as 2 vias".';else f.msg.textContent='';
      setTimeout(function(){URL.revokeObjectURL(url)},120000);
    }else if(modo==='baixar'){
      [[n1,'paciente'],[n2,'contratado']].forEach(function(p,i){setTimeout(function(){
        var u=URL.createObjectURL(C.build(J,r.d,now,p[1]).output('blob'));var a=h('a',{href:u,download:p[0]});document.body.append(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},30000)},i*500)});
      f.msg.textContent='As duas vias foram baixadas.';
    }else{
      f.msg.textContent='Guardando no Drive…';
      var a1={nome:n1,base64:bufB64(C.build(J,r.d,now,'paciente').output('arraybuffer'))},a2={nome:n2,base64:bufB64(C.build(J,r.d,now,'contratado').output('arraybuffer'))};
      var res=await api('salvarContrato',ctx(),{codigo:r.pac.codigo,publicar:f.pub.checked,titulo:'Contrato de prestação de serviços'},a1,a2);
      await recarregar();
      f.msg.replaceChildren(document.createTextNode('Pronto. 1ª via na pasta “'+res.pasta+'” e 2ª via em CONTRATOS, no Drive.'+(res.publicado?' O paciente foi avisado para assinar. ':' ')),
        isHttp(res.pastaUrl)?h('a',{href:res.pastaUrl,target:'_blank',rel:'noopener noreferrer'},'Abrir pasta do paciente'):'');
      toast(res.publicado?'Contrato guardado e enviado ao paciente.':'Contrato guardado no Drive.');
    }
  }catch(e){f.msg.textContent=e.message}
  bs.forEach(function(b){b.disabled=false});
}
function renderContratos(){if(P.ct)refreshSelects()}

/* ================= casca ================= */
var TABS_G=[{id:'agenda',label:'Agenda'},{id:'pacientes',label:'Pacientes'},{id:'recepcao',label:'Recepção'},{id:'financeiro',label:'Financeiro'},{id:'contratos_g',label:'Contratos'},{id:'profissionais',label:'Profissionais'},{id:'materiais',label:'Materiais'},{id:'disp',label:'Disponibilidade'},{id:'entrada',label:'Atualizações'}];
var TABS_P=[{id:'sessoes',label:'Minhas sessões'},{id:'avisos',label:'Avisos'},{id:'ficha',label:'Ficha'},{id:'pagamentos',label:'Pagamentos'},{id:'docs',label:'Documentos'},{id:'contratos',label:'Aceite'}];
function go(id){
  S.tab=id;
  if(S.modo==='paciente'){
    if(id==='avisos'){S.avRef=(S.d.perfil&&S.d.perfil.vistoEm)||'';marcarVistos()}else S.avRef=null;
  }
  renderShell();
}
async function marcarVistos(){
  if(!novosAvisos())return;
  try{var t=await api('marcarAvisosVistos',ctx());if(t&&S.d.perfil){S.d.perfil.vistoEm=t;renderTabs()}}catch(e){}
}
function renderTabs(){
  var tabs=document.getElementById('tabs');tabs.replaceChildren();
  if(!S.modo){tabs.hidden=true;return}
  tabs.hidden=false;
  (S.modo==='gestao'?TABS_G:TABS_P).forEach(function(t){
    var n=t.id==='entrada'?naoLidas():t.id==='recepcao'?itensRecepcao().length:t.id==='financeiro'?aConferir().length:t.id==='pagamentos'?abertasP().length:t.id==='avisos'?novosAvisos():(t.id==='ficha'&&!S.d.ficha?'!':0);
    tabs.append(h('button',{class:'tab',type:'button',role:'tab','aria-selected':S.tab===t.id?'true':'false',onclick:function(){go(t.id)}},t.label,n?h('span',{class:'badge'},n):null));
  });
}
function renderShell(){
  var g=S.modo==='gestao';
  document.getElementById('role-label').textContent=g?'Gestão':'Área do paciente';
  document.getElementById('sub').textContent=g?'Agenda, pacientes, profissionais, disponibilidade e atualizações.':'';document.getElementById('h-title').textContent='SiAGE | Sistema de Agendamento e Gestão Emotiss';document.querySelector('.top').classList.toggle('pac',!g);
  var act=document.getElementById('top-actions');act.replaceChildren.apply(act,[g?null:btnEquipe('Olá! Sou '+(primeiroNome()||'paciente')+' e preciso de ajuda com o meu atendimento.','small'),btn('Atualizar',function(){recarregar()},'small'),btn('Sair',function(){sair()},'small')].filter(Boolean));
  Object.keys(PANELS).forEach(function(k){PANELS[k].hidden=true});
  PANELS[g?S.tab:'p_'+S.tab].hidden=false;
  renderTabs();renderDados();
}
function renderDados(){
  if(S.modo==='gestao'){refreshSelects();renderAgenda();renderPacientes();renderRecepcao();renderFinanceiro();renderContratos();renderProfs();renderMateriais();renderAvisosGestao();renderDisp();renderEntrada();renderTabs()}
  else if(S.modo==='paciente'){renderPaciente();renderPagamentos()}
}
function refreshSelects(){
  var sv=P.ag&&P.ag.svc;
  if(sv){var pv=sv.value;sv.replaceChildren(opt('','Sem serviço específico'));svcs().forEach(function(x){sv.append(opt(x.id,x.nome))});if(pv)sv.value=pv}
  profSelects.forEach(function(ps){
    var prev=ps.sel.value;ps.sel.replaceChildren(opt('',ps.vazio));
    profsAtivos().forEach(function(p){ps.sel.append(opt(p.nome,p.nome))});
    if(prev&&Array.prototype.some.call(ps.sel.options,function(o){return o.value===prev}))ps.sel.value=prev;
  });
  var l=S.d.pacientes.slice().sort(function(a,b){return a.nome.localeCompare(b.nome)});
  patientSelects.forEach(function(ps){
    var prev=ps.sel.value;ps.sel.replaceChildren();
    if(ps.todos)ps.sel.append(opt('todos','Todos os pacientes'));
    l.forEach(function(p){ps.sel.append(opt(p.codigo,p.nome+' ('+p.codigo+')'))});
    if(!ps.todos&&!l.length)ps.sel.append(opt('','Nenhum paciente cadastrado'));
    if(prev&&Array.prototype.some.call(ps.sel.options,function(o){return o.value===prev}))ps.sel.value=prev;
  });
}

PANELS.gate=buildGate();

PANELS.p_sessoes=buildPSessoes();PANELS.p_avisos=buildPAvisos();PANELS.p_ficha=buildFicha();PANELS.p_pagamentos=buildPPagamentos();PANELS.p_docs=buildPDocs();PANELS.p_contratos=buildPContratos();
Object.keys(PANELS).forEach(function(k){if(k!=='gate')PANELS[k].hidden=true;main.append(PANELS[k])});
})();
