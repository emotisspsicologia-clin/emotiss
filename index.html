/* --- Complementos de Layout e Interatividade do SiAGE --- */
body {
  margin: 0;
  padding: 0;
  background: #fbf7ee;
  color: #17130f;
  font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.loading-overlay {
  position: fixed;
  inset: 0;
  background: rgba(251, 247, 238, 0.75);
  backdrop-filter: blur(2px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  font-size: 15px;
  font-weight: 600;
  color: #6b6358;
}
.spinner {
  width: 38px;
  height: 38px;
  border: 3.5px solid #e3dccd;
  border-top-color: #b8573b;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #17130f;
  color: #fff;
  padding: 14px 22px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  z-index: 10000;
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastIn 0.25s ease-out;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(23, 19, 15, 0.6);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9990;
  padding: 20px;
  box-sizing: border-box;
}
.modal-box {
  background: #fffdf8;
  border: 1px solid #e3dccd;
  border-radius: 20px;
  padding: 28px;
  max-width: 540px;
  width: 100%;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  max-height: 90vh;
  overflow-y: auto;
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 12px;
  color: #cdc5b6;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.18s ease;
}
.sidebar-link:hover {
  background: rgba(255,255,255,0.08);
  color: #f5f0e8;
}
.sidebar-link.active {
  background: #2a2520;
  color: #e8c98f;
}
.badge-count {
  margin-left: auto;
  background: #b8573b;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 999px;
}
.btn-tab {
  border: 1.5px solid #e3dccd;
  background: #fffdf8;
  color: #17130f;
  font: 600 13px 'Manrope', sans-serif;
  border-radius: 999px;
  padding: 8px 18px;
  cursor: pointer;
  transition: all 0.18s;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-tab.active {
  border-color: #17130f;
  background: #17130f;
  color: #f5f0e8;
}
</style>

// SiAGE SPA: interface consolidada em um index.html.
(function(){
'use strict';
var API = (window.SIAGE_CONFIG && window.SIAGE_CONFIG.apiUrl) || '';

var root=document.getElementById('app');
var loading=document.getElementById('loading');
var toastTimer;
function h(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function escAttr(x){return h(x).replace(/`/g,'&#96;');}
function showToast(m,err){var c=document.getElementById('toasts');c.innerHTML='<div class="toast" style="background:'+(err?'#8a2d1d':'#1f5a34')+'">'+h(m)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(function(){c.innerHTML='';},3800);}
function setBusy(v,msg){loading.style.display=v?'flex':'none';if(msg)document.getElementById('loading-txt').textContent=msg;}
function req(action,payload){setBusy(true,'Conectando ao sistema...');var a=s.user||{};var body=Object.assign({action:action,token:a.token||'',modo:a.perfil==='equipe'?'gestao':'paciente',codigo:a.codigo||''},payload||{});return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'}).then(function(r){return r.json();}).then(function(j){setBusy(false);if(!j.ok)throw new Error(j.erro||'Não foi possível concluir a solicitação.');return j.data;}).catch(function(e){setBusy(false);throw e;});}
function saveAuth(u,remember){s.user=u;try{var dst=remember?localStorage:sessionStorage;dst.setItem('siage_auth',JSON.stringify(u));(remember?sessionStorage:localStorage).removeItem('siage_auth');}catch(e){} }
function loadAuth(){try{var raw=localStorage.getItem('siage_auth')||sessionStorage.getItem('siage_auth');if(raw)s.user=JSON.parse(raw);}catch(e){}}
function logout(){s.user=null;s.data=null;try{localStorage.removeItem('siage_auth');sessionStorage.removeItem('siage_auth');}catch(e){}s.route='login';s.tab='paciente';s.page='hoje';render();}
function sessionCtx(){return {modo:(s.user&&s.user.perfil==='equipe')?'gestao':'paciente',perfil:s.user&&s.user.perfil,token:s.user&&s.user.token,codigo:s.user&&s.user.codigo};}
function escJson(v){return JSON.stringify(v||{}).replace(/</g,'\\u003c');}
function initials(n){var a=String(n||'').trim().split(/\s+/);return a.length>1?(a[0][0]+a[a.length-1][0]).toUpperCase():String(n||'--').slice(0,2).toUpperCase();}
function money(v){if(typeof v==='string'&&v.indexOf('R$')>=0)return v;return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function fmtDate(v){if(!v)return '—';var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));if(m)return m[3]+'/'+m[2]+'/'+m[1];try{return new Date(v).toLocaleDateString('pt-BR');}catch(e){return v;}}
function val(o,keys,fallback){for(var i=0;i<keys.length;i++){if(o&&o[keys[i]]!=null&&o[keys[i]]!=='')return o[keys[i]];}return fallback||'';}
function items(o,k){return Array.isArray(o)?o:(o&&Array.isArray(o[k])?o[k]:[]);}
function statusTag(status){var st=String(status||'').toLowerCase();var good=/realiz|pago|confirm|conclu|ativo|assinado/.test(st);var warn=/pend|aguard|aberto|enviado|comprov|agendad/.test(st);return '<span class="pl" style="background:'+(good?'#2f7d4f1f':warn?'#e8c98f55':'#b8573b1f')+';color:'+(good?'#1f5a34':warn?'#765a13':'#8a2d1d')+'">'+h(status||'—')+'</span>';}
function field(label,name,placeholder,type,value){return '<label style="display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#6b6358">'+h(label)+'<input class="fld" name="'+escAttr(name)+'" type="'+(type||'text')+'" placeholder="'+escAttr(placeholder||'')+'" value="'+escAttr(value||'')+'"></label>';}
function area(label,name,placeholder,value){return '<label style="display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:600;color:#6b6358">'+h(label)+'<textarea class="fld" name="'+escAttr(name)+'" placeholder="'+escAttr(placeholder||'')+'" style="min-height:110px">'+h(value||'')+'</textarea></label>';}
function button(label,action,cls){return '<button type="button" class="b '+(cls||'')+'" data-action="'+escAttr(action)+'">'+label+'</button>';}
function sidebar(active){var nav=[['hoje','Hoje','gestao-hoje.html'],['agenda','Agenda','gestao-agenda.html'],['pacientes','Pacientes','gestao-pacientes.html'],['financeiro','Financeiro','gestao-financeiro.html'],['contratos','Contratos','gestao-contratos.html'],['publicacoes','Publicações','gestao-publicacoes.html'],['clinica','Clínica','gestao-clinica.html']];return '<aside style="flex:0 0 216px;background:#17130f;color:#f5f0e8;padding:28px 16px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;min-width:216px;min-height:100vh"><div class="d" style="font-size:24px;font-weight:700;padding:0 12px 22px">emotiss<span style="color:#e8c98f">.</span></div><nav aria-label="Áreas" style="display:flex;flex-direction:column;gap:6px">'+nav.map(function(n){return '<a class="sidebar-link '+(active===n[0]?'active':'')+'" href="#'+n[0]+'">'+h(n[1])+'</a>';}).join('')+'</nav><div style="margin-top:auto;padding:16px 12px 0;border-top:1px solid #37312a;display:flex;gap:10px;align-items:center"><span class="av" style="width:36px;height:36px;background:#b8573b">'+h(initials(s.user&&s.user.nome||'Equipe'))+'</span><div style="font-size:13px;line-height:1.35"><b>'+h(s.user&&s.user.nome||'Equipe')+'</b><div style="color:#a59d8d;font-size:12px"><button type="button" data-action="logout" style="background:none;border:0;color:#a59d8d;padding:0;cursor:pointer;font:inherit">Sair</button></div></div></div></aside>';}
function header(title,sub){return '<header style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><input class="fld" id="global-search" placeholder="Buscar paciente por nome, código ou telefone" value="'+escAttr(s.search)+'" style="flex:1 1 260px;border-radius:999px;height:46px"><button class="b p" type="button" data-action="novo">+ Novo ▾</button></header><div><div class="lb">'+h(sub||'Gestão')+'</div><h1 style="font-size:34px;font-weight:700;margin-top:6px">'+h(title)+'</h1></div>';}
function shell(active,title,sub,content){return '<div style="display:flex;flex-wrap:wrap;min-height:100vh">'+sidebar(active)+'<main style="flex:999 1 560px;min-width:0;padding:28px 40px 48px;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">'+header(title,sub)+content+'</main></div>';}
function cards(itemsArr,renderer,empty){return itemsArr.length?itemsArr.map(renderer).join(''):'<div class="card" style="padding:28px;text-align:center;color:#6b6358">'+h(empty||'Nenhum registro encontrado.')+'</div>';}
function getData(){var action=s.user&&s.user.perfil==='equipe'?'getEstado':'getEstado';return req(action,{ctx:sessionCtx()}).then(function(d){s.data=d||{};if(s.user&&s.user.perfil==='paciente'){if(d&&d.perfil&&d.perfil.nome)s.user.nome=d.perfil.nome;if(d&&d.novoToken)s.user.token=d.novoToken;try{saveAuth(s.user,!!localStorage.getItem('siage_auth'));}catch(e){}}}).catch(function(e){if(/SESSAO_EXPIRADA/.test(e.message)){logout();throw new Error('Sua sessão expirou. Entre novamente.');}throw e;});}
function loginView(){var isTeam=s.tab==='equipe';return '<div style="min-height:100vh;display:flex;flex-direction:column"><header style="display:flex;justify-content:space-between;align-items:center;padding:28px 56px"><div class="d" style="font-size:26px;font-weight:700">emotiss<span style="color:#b8573b">.</span></div><span style="font-size:14px;color:#6b6358">SiAGE · Acesso seguro</span></header><main style="flex:1;display:flex;flex-wrap:wrap;gap:48px;align-items:center;justify-content:center;padding:24px 56px 56px;max-width:1180px;margin:0 auto;width:100%;box-sizing:border-box"><div style="flex:1 1 440px;min-width:0"><div class="lb" style="font-weight:700;font-size:12px;letter-spacing:.09em;color:#9c4429">'+(isTeam?'ÁREA DA EQUIPE':'ÁREA DO PACIENTE')+'</div><h1 style="font-size:46px;line-height:1.08;margin-top:14px;max-width:520px">'+(isTeam?'Gestão da clínica, em um só painel':'Agende suas sessões e acompanhe tudo em um só lugar')+'</h1><p style="margin:16px 0 0;font-size:17px;line-height:1.6;color:#3a322a;max-width:500px">'+(isTeam?'Agenda, pacientes, financeiro e publicações, com seu perfil em cada item.':'Entre com seu e-mail ou código do paciente para acompanhar seus atendimentos.')+'</p></div><div style="flex:0 0 420px;max-width:100%;background:#17130f;color:#f5f0e8;border-radius:24px;padding:32px;box-shadow:0 2px 4px #17130f0f,0 24px 50px #17130f40;box-sizing:border-box"><div style="display:flex;background:#2a2520;border-radius:999px;padding:4px;margin-bottom:24px"><button class="b '+(!isTeam?'p':'')+'" style="flex:1;border:0" data-action="tab-paciente">Paciente</button><button class="b '+(isTeam?'p':'')+'" style="flex:1;border:0" data-action="tab-equipe">Equipe</button></div>'+(isTeam?'<h2 style="font-size:26px">Acesso da equipe</h2><p style="margin:8px 0 18px;font-size:14px;line-height:1.6;color:#cdc5b6">Entre com a senha da gestão.</p>'+field('Senha','senha','Sua senha','password')+'<button class="b p" type="button" data-action="login-equipe" style="width:100%;margin-top:20px">Entrar na gestão</button>':'<h2 style="font-size:26px">Entrar</h2><p style="margin:8px 0 18px;font-size:14px;line-height:1.6;color:#cdc5b6">Enviaremos um código e um link de acesso para seu e-mail.</p>'+field('E-mail ou código do paciente','identificador','voce@exemplo.com')+'<label style="display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13px;line-height:1.5;color:#cdc5b6"><input type="checkbox" id="lembrar" style="margin-top:3px;accent-color:#b8573b">Manter conectado neste aparelho</label><button class="b p" type="button" data-action="pedir-codigo" style="width:100%;margin-top:20px">Receber código por e-mail</button><div style="border-top:1px solid #37312a;margin-top:22px;padding-top:18px;text-align:center;font-size:14px;color:#cdc5b6">Primeira vez aqui? <button type="button" data-action="ir-cadastro" style="border:0;background:none;color:#e8c98f;font:700 14px Manrope,sans-serif;cursor:pointer;text-decoration:underline">Criar cadastro</button></div>')+'</div></main><footer style="border-top:1px solid #e3dccd;padding:20px 56px;font-size:13px;color:#6b6358">SiAGE · Sistema de Agendamento e Gestão Emotiss</footer></div>';}
function otpView(){return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px"><section class="card" style="max-width:460px;width:100%;padding:32px;background:#17130f;color:#f5f0e8"><h2 style="font-size:26px">Digite o código</h2><p style="color:#cdc5b6;line-height:1.6">Enviamos um código para <b>'+h(s.otpEmail)+'</b>.</p>'+field('Código de acesso','otp','6 dígitos')+'<button class="b p" style="width:100%;margin-top:20px" data-action="verificar-codigo">Entrar</button><button class="b" style="margin-top:12px;color:#f5f0e8;border-color:#5a5247" data-action="voltar-login">Usar outro e-mail</button></section></div>';}
function cadastroView(){return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px"><section class="card" style="max-width:480px;width:100%;padding:30px;background:#17130f;color:#f5f0e8"><h2 style="font-size:26px">Primeiro acesso</h2><p style="color:#cdc5b6;line-height:1.6">Preencha seus dados para criar seu cadastro.</p>'+field('Nome completo','nome','Como prefere ser chamado?')+'<div style="height:12px"></div>'+field('E-mail','email','voce@exemplo.com','email')+'<div style="height:12px"></div>'+field('Telefone','telefone','(00) 00000-0000','tel')+'<label style="display:flex;gap:10px;margin-top:16px;color:#cdc5b6;font-size:13px"><input type="checkbox" id="lgpd">Concordo com o tratamento dos meus dados conforme a LGPD.</label><button class="b p" style="width:100%;margin-top:20px" data-action="cadastrar">Criar cadastro</button><button class="b" style="margin-top:12px;color:#f5f0e8;border-color:#5a5247" data-action="voltar-login">Já tenho cadastro</button></section></div>';}
function profileData(){var d=s.data||{};var mats=items(d,'materiais');var ag=items(d,'agenda').concat(items(d,'sessoes')).sort(function(x,y){return (String(x.data||'')+String(x.hora||''))<(String(y.data||'')+String(y.hora||''))?-1:1;});return {agenda:ag,pacientes:items(d,'pacientes'),avisos:items(d,'avisos'),cobrancas:items(d,'cobrancas'),materiais:mats,contratos:mats.filter(function(m){return m.categoria==='contrato';}),profissionais:items(d,'profissionais'),disponibilidade:items(d,'disponibilidade'),mensagens:items(d,'mensagens'),fichas:items(d,'fichas')};}
function rowCard(o,kind){var name=kind==='agenda'?([o.iniciais,svcNome(o.servico)].filter(Boolean).join(' · ')||'Sessão'):kind==='disp'?(DIAS[Number(o.diaSemana)]||'Disponibilidade'):val(o,['nome','paciente','titulo','nomePaciente','descricao','iniciais'],'Registro');var detail=kind==='agenda'?brDate(o.data)+' · '+(o.hora||'')+' · '+(o.modalidade||'')+(o.profissional?' · '+o.profissional:''):kind==='disp'?(o.inicio||'')+' às '+(o.fim||'')+' · '+(o.profissional||'Todos os profissionais'):kind==='paciente'?val(o,['codigo','id'],'')+' · '+val(o,['email','telefone'],''):kind==='cobranca'?money(val(o,['valor','total'],0))+' · venc. '+fmtDate(val(o,['vencimento','data'])):val(o,['mensagem','descricao','tipo','data'],'');var status=val(o,['situacao','status','estado'],'');var id=val(o,['id','codigo','arquivoId'],'');return '<article class="card row" style="padding:14px 18px;display:flex;gap:12px;align-items:center"><span class="av" style="width:38px;height:38px;background:#b8573b">'+h(initials(name))+'</span><div style="flex:1;min-width:0"><b class="d" style="font-size:15px">'+h(name)+'</b><div style="font-size:13px;color:#6b6358">'+h(detail)+'</div></div>'+(status?statusTag(status):'')+'<button class="b s" data-action="detalhe" data-kind="'+kind+'" data-id="'+escAttr(id)+'">Abrir</button></article>';}
function dashboard(){var d=profileData();var content='<section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px"><div class="card" style="padding:18px"><div class="lb">Sessões</div><b class="d" style="font-size:24px">'+d.agenda.length+'</b></div><div class="card" style="padding:18px"><div class="lb">Pacientes</div><b class="d" style="font-size:24px">'+d.pacientes.length+'</b></div><div class="card" style="padding:18px"><div class="lb">Cobranças</div><b class="d" style="font-size:24px">'+d.cobrancas.length+'</b></div><div class="card" style="padding:18px"><div class="lb">Avisos</div><b class="d" style="font-size:24px">'+d.avisos.length+'</b></div></section><section class="card" style="padding:22px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:18px">Agenda recente</h2>'+button('Ver agenda','route-agenda','s')+'</div><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">'+cards(d.agenda.filter(function(x){return String(x.data)>=todayIso();}).slice(0,5),function(o){return rowCard(o,'agenda');},'Nenhuma sessão cadastrada.')+'</div></section><section class="card" style="padding:22px"><h2 style="font-size:18px">Atenção necessária</h2><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">'+cards(d.cobrancas.filter(function(o){return /pend|aguard|comprov/i.test(val(o,['status','situacao'],''));}).slice(0,4),function(o){return rowCard(o,'cobranca');},'Nenhuma cobrança pendente.')+'</div></section>';return shell('hoje','Hoje','Painel da clínica',content);}

function pacientesView(){var d=profileData();var query=s.search.toLowerCase();var list=d.pacientes.filter(function(p){return !query||JSON.stringify(p).toLowerCase().indexOf(query)>=0;});var content='<div style="display:flex;gap:8px;flex-wrap:wrap">'+button('+ Cadastrar paciente','novo-paciente','p')+'</div><section class="card" style="padding:8px 22px;display:flex;flex-direction:column;gap:8px">'+cards(list,function(o){return rowCard(o,'paciente');},'Nenhum paciente encontrado.')+'</section>';return shell('pacientes','Pacientes','Pacientes · Lista',content);}
function financeiroView(){var d=profileData();var content='<div style="display:flex;gap:8px;flex-wrap:wrap">'+button('+ Criar cobrança','nova-cobranca','p')+'</div><section class="card" style="padding:8px 22px;display:flex;flex-direction:column;gap:8px">'+cards(d.cobrancas,function(o){return rowCard(o,'cobranca');},'Nenhuma cobrança cadastrada.')+'</section>';return shell('financeiro','Financeiro','Cobranças e pagamentos',content);}
function contratosView(){var d=profileData();var content='<div style="display:flex;gap:8px;flex-wrap:wrap">'+button('+ Novo contrato','novo-contrato','p')+'</div><section class="card" style="padding:8px 22px;display:flex;flex-direction:column;gap:8px">'+cards(d.contratos,function(o){return rowCard(o,'contrato');},'Nenhum contrato cadastrado.')+'</section>';return shell('contratos','Contratos','Pacientes · Contratos',content);}
