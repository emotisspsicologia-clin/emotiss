<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiAGE | Emotiss</title>
<meta name="theme-color" content="#17130f">
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Work+Sans:wght@600;700&display=swap');

:root {
  --bg: #f5f0e8;
  --fg: #17130f;
  --card-bg: #fffdf8;
  --border: #e3dccd;
  --border-field: #cdc5b6;
  --dark: #17130f;
  --dark-light: #2a2520;
  --accent: #b8573b;
  --accent-hover: #a14a30;
  --gold: #e8c98f;
  --green: #2f7d4f;
  --green-bg: #2f7d4f1a;
  --red: #a02a1c;
  --red-bg: #a02a1c12;
  --muted: #6b6358;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  margin: 0;
  font-family: 'Manrope', system-ui, -apple-system, sans-serif;
  color: var(--fg);
  background: var(--bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .d {
  font-family: 'Work Sans', system-ui, sans-serif;
  margin: 0;
  letter-spacing: -0.015em;
}

/* Button system */
.b {
  appearance: none;
  border: 1.5px solid var(--border-field);
  background: transparent;
  color: var(--fg);
  font: 600 13px 'Manrope', sans-serif;
  border-radius: 999px;
  height: 40px;
  padding: 0 18px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  transition: transform .18s cubic-bezier(.2,.7,.2,1), background .18s, border-color .18s, box-shadow .18s;
  white-space: nowrap;
}
.b:hover { border-color: var(--accent); transform: translateY(-1px); }
.b:active { transform: scale(0.98); }
.b.s { height: 34px; padding: 0 14px; font-size: 12px; }
.b.p { background: var(--accent); border-color: var(--accent); color: #fff; }
.b.p:hover { background: var(--accent-hover); box-shadow: 0 6px 16px rgba(184,87,59,0.25); }
.b.k { background: var(--dark); border-color: var(--dark); color: var(--bg); }
.b.k:hover { background: var(--dark-light); }
.b.r { color: var(--red); border-color: #e6c3bd; }
.b.r:hover { background: var(--red-bg); border-color: var(--red); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Pills & Badges */
.pl {
  display: inline-flex;
  align-items: center;
  font-weight: 700;
  font-size: 12px;
  border-radius: 999px;
  padding: 4px 12px;
  white-space: nowrap;
}
.pl.confirmada { background: #2f7d4f1f; color: #1f5a34; }
.pl.agendada { background: #17130f14; color: #3a322a; }
.pl.realizada { background: #e8c98f40; color: #875c1c; }
.pl.faltou { background: #a02a1c1a; color: #a02a1c; }
.pl.cancelada { background: #e3dccd; color: #6b6358; }

/* Cards & Containers */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 18px;
  box-shadow: 0 1px 2px rgba(23,19,15,0.05), 0 4px 14px rgba(23,19,15,0.05);
}
.lb {
  font-weight: 700;
  font-size: 11px;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--muted);
}
.av {
  border-radius: 999px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 700 13px 'Work Sans', sans-serif;
  flex: none;
}
.row {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.row:last-child { border-bottom: none; }
.fld {
  height: 42px;
  border: 1.5px solid var(--border-field);
  border-radius: 12px;
  background: var(--card-bg);
  padding: 0 14px;
  font: 500 14px 'Manrope', sans-serif;
  color: var(--fg);
  width: 100%;
  box-sizing: border-box;
  transition: border-color .18s, box-shadow .18s;
}
.fld:focus {
  border-color: var(--accent);
  outline: none;
  box-shadow: 0 0 0 3px rgba(184,87,59,0.15);
}
select.fld {
  cursor: pointer;
  appearance: auto;
}
textarea.fld {
  height: auto;
  min-height: 80px;
  padding: 10px 14px;
}

/* Sidebar Navigation */
.sbl {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 12px;
  color: #cdc5b6;
  font: 600 14px 'Manrope', sans-serif;
  text-decoration: none;
  cursor: pointer;
  transition: background .18s, color .18s;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
}
.sbl:hover { background: rgba(245,240,232,0.1); color: #f5f0e8; }
.sbl.on { background: rgba(245,240,232,0.15); color: #f5f0e8; font-weight: 700; }
.bd {
  margin-left: auto;
  background: var(--accent);
  color: #fff;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
}
.tl { transition: transform .18s cubic-bezier(.2,.7,.2,1), box-shadow .18s; }
.tl:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(23,19,15,0.12); }

@keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.in { animation: up .32s cubic-bezier(.2,.7,.2,1) both; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(184,87,59,0.45); } 70%, 100% { box-shadow: 0 0 0 10px rgba(184,87,59,0); } }

/* Modals & Dialogs */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(23, 19, 15, 0.65);
  backdrop-filter: blur(4px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-box {
  background: #fffdf8;
  border: 1px solid var(--border);
  border-radius: 24px;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 50px rgba(23,19,15,0.25);
  padding: 32px;
  transform: scale(0.96) translateY(8px);
  transition: transform .2s cubic-bezier(.2,.7,.2,1);
}
.modal-overlay.open .modal-box {
  transform: scale(1) translateY(0);
}

/* Toast notifications */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--dark);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  font: 600 13px 'Manrope', sans-serif;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: all .25s ease;
}
#toast.show {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

/* App Views */
.app-view { display: none; }
.app-view.active { display: flex; flex-direction: column; }

/* Responsive adjustments */
@media (max-width: 900px) {
  .sidebar-layout { flex-direction: column !important; }
  aside.main-aside { flex: 0 0 auto !important; width: 100% !important; min-width: 0 !important; }
  .grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
}

.shell{display:flex;min-height:100vh}
.main-aside{flex:0 0 216px;min-width:216px;background:#17130f;color:#f5f0e8;padding:28px 16px;display:flex;flex-direction:column;gap:6px}
.workspace{flex:1;min-width:0;padding:28px 40px 48px;display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar input{flex:1 1 260px;max-width:600px}
.content-area{display:flex;flex-direction:column;gap:24px}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.tile{padding:18px;text-align:left;min-height:112px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:14px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;font-weight:700;color:#514a40}
.field.full{grid-column:1/-1}
.card-pad{padding:22px}
.patient-nav{display:flex;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px}
.patient-nav button{border:0;background:transparent;font:700 13px Manrope,sans-serif;color:var(--muted);cursor:pointer;padding:8px 2px}
.patient-nav button.active{color:var(--accent);border-bottom:2px solid var(--accent)}
#loadingOverlay{position:fixed;inset:0;background:#f5f0e8;z-index:5000;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.spinner{width:36px;height:36px;border:3px solid #e3dccd;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.shell{flex-direction:column}.main-aside{width:100%;min-width:0;flex-basis:auto;padding:18px}.workspace{padding:22px 18px 36px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.workspace{padding:16px 12px 28px}.tiles{gap:8px}.tile{padding:12px}}
</style>
</head>
<body>
<div id="loadingOverlay" style="display:none"><div class="spinner"></div><div style="font-weight:700;color:#6b6358">Carregando SiAGE…</div></div>
<div id="app"></div><div id="toast"></div>
<div id="modal" class="modal-overlay"><div class="modal-box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><h2 id="modalTitle" style="font-size:22px"></h2><button id="modalClose" class="b s" type="button">Fechar</button></div><div id="modalBody"></div></div></div>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwQzCCxphSTv3PsWwgUFcLkQRB1-xncnTPvm_MKBkQ1gcfxTCHOmAfoZcv0ka2lmz0T/exec';
const ICON = {"hoje": "\u263c", "agenda": "\u25a6", "pacientes": "\u2659", "financeiro": "\u25a3", "publicacoes": "\u25d6", "clinica": "\u2661"};
const state={ctx:null,data:null,view:'hoje',patientTab:'sessoes',patientStage:'',pendingId:'',pendingRemember:false};
let toastTimer;
function toast(msg,isError=false){const el=document.getElementById('toast');el.textContent=msg;el.style.background=isError?'#a02a1c':'#17130f';el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3400)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(s){if(!s)return '—';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function request(fn,...args){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})}).then(async r=>{let data=await r.json();if(!data.ok)throw new Error(data.erro||'Não foi possível concluir a operação.');return data.data})}
function setSession(mode,token,codigo=''){state.ctx=mode==='gestao'?{modo:'gestao',token}:{modo:'paciente',token,codigo};sessionStorage.setItem('siage_ctx',JSON.stringify(state.ctx));loadState()}
function readSession(){try{const raw=sessionStorage.getItem('siage_ctx');if(raw)state.ctx=JSON.parse(raw)}catch(e){state.ctx=null}}
function signOut(){state.ctx=null;state.data=null;sessionStorage.removeItem('siage_ctx');renderLogin()}
async function loadState(){try{document.getElementById('loadingOverlay').style.display='flex';state.data=await request('getEstado',state.ctx);if(state.data.novoToken&&state.ctx.modo==='paciente'){state.ctx.token=state.data.novoToken;sessionStorage.setItem('siage_ctx',JSON.stringify(state.ctx))}renderApp()}catch(e){signOut();toast(e.message,true)}finally{document.getElementById('loadingOverlay').style.display='none'}}
function renderLogin(){document.getElementById('app').innerHTML=`
<div class="app-view active" style="min-height:100vh;display:flex;flex-direction:column">
<header style="display:flex;justify-content:space-between;align-items:center;padding:28px 56px"><div class="d" style="font-size:26px;font-weight:700">emotiss<span style="color:var(--accent)">.</span></div><a href="mailto:emotiss.psicologia@gmail.com" style="font-size:14px;font-weight:600;color:var(--fg);text-decoration:none">Precisa de ajuda? Fale com a equipe</a></header>
<main style="flex:1;display:flex;flex-wrap:wrap;gap:48px;align-items:center;justify-content:center;padding:24px 56px 56px;max-width:1180px;margin:0 auto;width:100%">
<section style="flex:1 1 440px;min-width:0"><div class="lb" style="color:#9c4429">BEM-VINDA À EMOTISS</div><h1 style="font-size:46px;line-height:1.08;margin-top:14px;max-width:520px">Seu cuidado, no seu ritmo.</h1><p style="margin:16px 0 0;font-size:17px;line-height:1.6;color:#3a322a;max-width:500px">Um espaço para cuidar de você, com acolhimento, organização e segurança.</p><div style="display:flex;flex-direction:column;gap:16px;margin-top:30px"><div style="display:flex;gap:14px;align-items:center"><span class="d" style="width:44px;height:44px;border-radius:999px;background:var(--dark);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700">01</span><div><b>Acompanhe suas sessões</b><div style="font-size:14px;color:var(--muted)">Horários, avisos e documentos num só lugar.</div></div></div><div style="display:flex;gap:14px;align-items:center"><span class="d" style="width:44px;height:44px;border-radius:999px;background:var(--dark);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700">02</span><div><b>Converse com a equipe</b><div style="font-size:14px;color:var(--muted)">Envie solicitações de forma simples e segura.</div></div></div><div style="display:flex;gap:14px;align-items:center"><span class="d" style="width:44px;height:44px;border-radius:999px;background:var(--dark);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700">03</span><div><b>Agende com autonomia</b><div style="font-size:14px;color:var(--muted)">Escolha o serviço e o horário que funcionam para você.</div></div></div></div></section>
<section style="flex:0 0 420px;max-width:100%;background:var(--dark);color:var(--bg);border-radius:24px;padding:32px;box-shadow:0 24px 50px rgba(23,19,15,.25)">
<div style="display:flex;background:var(--dark-light);border-radius:999px;padding:4px;margin-bottom:24px"><button id="patientTabBtn" type="button" class="login-tab" style="flex:1;height:36px;border:0;border-radius:999px;font:700 13px Manrope,sans-serif;cursor:pointer;background:#f5f0e8;color:#17130f">Paciente</button><button id="adminTabBtn" type="button" class="login-tab" style="flex:1;height:36px;border:0;border-radius:999px;font:700 13px Manrope,sans-serif;cursor:pointer;background:transparent;color:#cdc5b6">Gestão</button></div>
<div id="patientLogin"><h2 style="font-size:24px">Acesse sua área</h2><p style="font-size:14px;color:#cdc5b6;line-height:1.5;margin-top:6px">Entre com seu e-mail ou código de acesso.</p><form id="patientForm" style="margin-top:24px;display:flex;flex-direction:column;gap:12px"><label style="font-size:13px;font-weight:700;color:#e3dccd">E-mail ou código</label><input id="patientId" class="fld" autocomplete="username" placeholder="seu@email.com ou PAC-XXXXXXXX" required><label style="display:flex;gap:10px;align-items:center;font-size:13px;color:#cdc5b6"><input id="rememberPatient" type="checkbox" style="accent-color:var(--accent)"> Manter conectado neste aparelho</label><button class="b p" style="width:100%;height:46px;font-size:14px">Continuar →</button><div id="patientLoginMsg" style="min-height:18px;color:#e8c98f;font-size:12px"></div></form><div style="border-top:1px solid #37312a;margin-top:22px;padding-top:18px;text-align:center;font-size:13px;color:#cdc5b6">Ainda não tem acesso? <button id="signupOpen" type="button" style="border:0;background:none;color:#e8c98f;font:700 13px Manrope,sans-serif;cursor:pointer;text-decoration:underline">Cadastre-se</button></div></div>
<div id="adminLogin" style="display:none"><h2 style="font-size:24px">Acesso da gestão</h2><p style="font-size:14px;color:#cdc5b6;margin-top:6px">Entre com a senha administrativa.</p><form id="adminForm" style="margin-top:24px;display:flex;flex-direction:column;gap:12px"><label style="font-size:13px;font-weight:700;color:#e3dccd">Senha</label><input id="adminPassword" class="fld" type="password" autocomplete="current-password" placeholder="Sua senha" required><button class="b p" style="width:100%;height:46px;font-size:14px">Entrar na gestão →</button><div id="adminLoginMsg" style="min-height:18px;color:#e8c98f;font-size:12px"></div></form></div>
<div id="patientOtp" style="display:none"><h2 style="font-size:24px">Confirme seu acesso</h2><p id="otpInfo" style="font-size:14px;color:#e8c98f;margin-top:6px"></p><form id="otpForm" style="margin-top:22px;display:flex;flex-direction:column;gap:12px"><label style="font-size:13px;font-weight:700;color:#e3dccd">Código de 6 dígitos</label><input id="otpCode" class="fld" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required style="letter-spacing:.3em;text-align:center;font-size:18px"><button class="b p" style="width:100%;height:46px">Entrar</button><button id="otpBack" class="b" type="button" style="width:100%;color:#f5f0e8;border-color:#645b50">Voltar</button><div id="otpMsg" style="min-height:18px;color:#e8c98f;font-size:12px"></div></form></div>
<div id="signup" style="display:none"><h2 style="font-size:24px">Criar acesso</h2><p style="font-size:14px;color:#cdc5b6;margin-top:6px">Preencha seus dados para receber seu acesso por e-mail.</p><form id="signupForm" style="margin-top:20px;display:flex;flex-direction:column;gap:10px"><input id="signupName" class="fld" placeholder="Nome completo" required><input id="signupEmail" class="fld" type="email" placeholder="E-mail" required><input id="signupPhone" class="fld" type="tel" placeholder="Telefone (opcional)"><label style="display:flex;gap:8px;font-size:12px;color:#cdc5b6"><input id="signupConsent" type="checkbox" required> Autorizo o uso dos meus dados para cadastro e atendimento, conforme a LGPD.</label><button class="b p" style="width:100%;height:44px">Solicitar acesso</button><button id="signupBack" type="button" class="b" style="width:100%;color:#f5f0e8;border-color:#645b50">Voltar ao login</button><div id="signupMsg" style="min-height:18px;color:#e8c98f;font-size:12px"></div></form></div>
</section></main><footer style="text-align:center;padding:18px;color:#8d8477;font-size:12px">SiAGE · Emotiss</footer></div>`;
 document.getElementById('patientTabBtn').onclick=()=>switchLogin('patient');document.getElementById('adminTabBtn').onclick=()=>switchLogin('admin');document.getElementById('signupOpen').onclick=()=>showLoginPanel('signup');document.getElementById('signupBack').onclick=()=>showLoginPanel('patientLogin');document.getElementById('otpBack').onclick=()=>showLoginPanel('patientLogin');
 document.getElementById('patientForm').onsubmit=async e=>{e.preventDefault();let msg=document.getElementById('patientLoginMsg');msg.textContent='Enviando…';state.pendingId=document.getElementById('patientId').value.trim();state.pendingRemember=document.getElementById('rememberPatient').checked;try{let r=await request('iniciarLoginPaciente',state.pendingId,state.pendingRemember);if(r.token){setSession('paciente',r.token,r.codigo);return}document.getElementById('otpInfo').textContent='Enviamos um código para '+(r.email||'seu e-mail cadastrado')+'.';showLoginPanel('patientOtp')}catch(err){msg.textContent=err.message}};
 document.getElementById('otpForm').onsubmit=async e=>{e.preventDefault();let msg=document.getElementById('otpMsg');msg.textContent='Validando…';try{let r=await request('verificarLoginPaciente',state.pendingId,document.getElementById('otpCode').value,state.pendingRemember);setSession('paciente',r.token,r.codigo)}catch(err){msg.textContent=err.message}};
 document.getElementById('adminForm').onsubmit=async e=>{e.preventDefault();let msg=document.getElementById('adminLoginMsg');msg.textContent='Entrando…';try{let r=await request('loginGestao',document.getElementById('adminPassword').value);setSession('gestao',r.token)}catch(err){msg.textContent=err.message}};
 document.getElementById('signupForm').onsubmit=async e=>{e.preventDefault();let msg=document.getElementById('signupMsg');msg.textContent='Enviando…';try{await request('cadastrarPaciente',{nome:document.getElementById('signupName').value,email:document.getElementById('signupEmail').value,telefone:document.getElementById('signupPhone').value,aceite:document.getElementById('signupConsent').checked});msg.textContent='Cadastro enviado. Confira seu e-mail para receber as instruções de acesso.'}catch(err){msg.textContent=err.message}};
}
function switchLogin(which){let p=which==='patient';document.getElementById('patientLogin').style.display=p?'block':'none';document.getElementById('adminLogin').style.display=p?'none':'block';document.getElementById('patientOtp').style.display='none';document.getElementById('signup').style.display='none';document.getElementById('patientTabBtn').style.background=p?'#f5f0e8':'transparent';document.getElementById('patientTabBtn').style.color=p?'#17130f':'#cdc5b6';document.getElementById('adminTabBtn').style.background=p?'transparent':'#f5f0e8';document.getElementById('adminTabBtn').style.color=p?'#cdc5b6':'#17130f'}
function showLoginPanel(id){['patientLogin','adminLogin','patientOtp','signup'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none')}

function dateToday(){return new Date().toISOString().slice(0,10)}
function initials(n){return String(n||'').split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'??'}
function getPatient(code){return (state.data.pacientes||[]).find(p=>p.codigo===code)||{}}
function activeTitle(){return ({hoje:'Hoje',agenda:'Agenda',pacientes:'Pacientes',financeiro:'Financeiro',publicacoes:'Publicações',clinica:'Clínica'})[state.view]||'Hoje'}
function renderApp(){if(!state.data)return;state.ctx.modo==='gestao'?renderAdmin():renderPatient()}
function adminSidebar(){let nav=[['hoje','Hoje','hoje'],['agenda','Agenda','agenda'],['pacientes','Pacientes','pacientes'],['financeiro','Financeiro','financeiro'],['publicacoes','Publicações','publicacoes'],['clinica','Clínica','clinica']];return `<aside class="main-aside"><div class="d" style="font-size:24px;font-weight:700;padding:0 12px 22px">emotiss<span style="color:var(--gold)">.</span></div><nav style="display:flex;flex-direction:column;gap:5px">${nav.map(([k,l,ic])=>`<button class="sbl ${state.view===k?'on':''}" data-view="${k}">${ICON[ic]||''}${l}</button>`).join('')}</nav><div style="margin-top:auto;padding:16px 12px 0;border-top:1px solid #37312a;display:flex;gap:10px;align-items:center"><span class="av" style="width:36px;height:36px;background:var(--accent)">HM</span><div style="font-size:13px"><b>Gestão Emotiss</b><div style="color:#a59d8d;font-size:12px;cursor:pointer" id="sideLogout">Sair</div></div></div></aside>`}
function renderAdmin(){let data=state.data;let patients=data.pacientes||[],agenda=data.agenda||[],unread=(data.mensagens||[]).filter(x=>x.situacao==='nova');let today=dateToday();let todaySessions=agenda.filter(x=>x.data===today&&x.status!=='cancelada');let viewHtml=state.view==='hoje'?adminHome(todaySessions,unread):state.view==='agenda'?adminAgenda(agenda):state.view==='pacientes'?adminPatients(patients):state.view==='financeiro'?adminFinance():state.view==='publicacoes'?adminPublications():adminClinic();document.getElementById('app').innerHTML=`<div class="shell">${adminSidebar()}<main class="workspace"><div class="topbar"><div style="position:relative;flex:1 1 260px;max-width:600px"><input id="globalSearch" class="fld" placeholder="⌕  Buscar paciente por nome, código ou telefone"><div id="searchResults" class="card" style="display:none;position:absolute;top:50px;left:0;right:0;z-index:20;padding:8px"></div></div><button id="newPatientBtn" class="b p">+ Novo paciente</button></div><div class="content-area">${viewHtml}</div></main></div>`;bindAdminEvents();}
function adminHome(sessions,messages){let all=state.data.agenda||[],pending=all.filter(x=>['agendada','confirmada'].includes(x.status));return `<div><div class="lb">GESTÃO · ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><h1 style="font-size:34px;margin-top:5px">Bom dia, equipe</h1></div><div class="tiles">${[['Sessões de hoje',sessions.length,'#b8573b'],['Pacientes ativos',(state.data.pacientes||[]).length,'#2f7d4f'],['Próximas sessões',pending.length,'#94600f'],['Mensagens novas',messages.length,'#a02a1c'],['Cobranças em aberto',(state.data.cobrancas||[]).filter(x=>x.status!=='pago').length,'#7a4a8a']].map(([l,v,c])=>`<div class="card tile"><div class="lb">${l}</div><div class="d" style="font-size:34px;font-weight:700;margin-top:8px;color:${c}">${v}</div></div>`).join('')}</div><section><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px"><h2 style="font-size:20px">Sessões de hoje</h2><button class="b s" data-view="agenda">Ver agenda</button></div>${sessions.length?`<div class="card card-pad" style="margin-top:12px">${sessions.sort((a,b)=>a.hora.localeCompare(b.hora)).map(sessionRow).join('')}</div>`:`<div class="card card-pad" style="margin-top:12px;color:var(--muted)">Nenhuma sessão marcada para hoje.</div>`}</section><section><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px"><h2 style="font-size:20px">Precisa de ação</h2></div>${messages.length?`<div class="card card-pad" style="margin-top:12px">${messages.map(m=>`<div class="row"><div style="flex:1"><b>${esc(m.titulo||'Mensagem')}</b><div style="font-size:13px;color:var(--muted);margin-top:3px">${esc(m.iniciais||'Paciente')} · ${esc(m.mensagem||'')}</div></div><button class="b s" data-message-read="${esc(m.id)}">Marcar lida</button></div>`).join('')}</div>`:`<div class="card card-pad" style="margin-top:12px;color:var(--muted)">Tudo em dia.</div>`}</section>`}
function sessionRow(s){let p=getPatient(s.codigo);return `<div class="row"><div style="width:54px;height:54px;border-radius:16px;background:#f2e5d9;color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700">${esc(s.hora||'')}</div><div style="flex:1"><b>${esc(p.nome||s.iniciais||'Paciente')}</b><div style="font-size:13px;color:var(--muted)">${fmtDate(s.data)} · ${esc(s.modalidade||'')} · ${esc(s.profissional||'')}</div></div><span class="pl ${esc(s.status)}">${esc(s.status||'agendada')}</span><button class="b s" data-status="${esc(s.id)}" data-next="realizada">Concluir</button></div>`}
function adminAgenda(items){let sorted=[...items].filter(x=>x.status!=='cancelada').sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));return `<div><div class="lb">HOJE · AGENDA</div><h1 style="font-size:34px;margin-top:5px">Agenda</h1><p style="color:var(--muted);margin-top:6px">Sessões registradas no sistema.</p></div><div class="card card-pad"><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px"><input class="fld" id="agendaFilter" type="date" value="${dateToday()}" style="max-width:220px"><select id="statusFilter" class="fld" style="max-width:200px"><option value="">Todos os status</option><option>agendada</option><option>confirmada</option><option>realizada</option><option>faltou</option></select><button class="b p" id="newSessionBtn">+ Nova sessão</button></div><div class="table-wrap"><table><thead><tr><th>Data</th><th>Hora</th><th>Paciente</th><th>Profissional</th><th>Modalidade</th><th>Status</th><th>Ação</th></tr></thead><tbody id="agendaRows">${sorted.map(s=>`<tr data-date="${esc(s.data)}" data-status-value="${esc(s.status)}"><td>${fmtDate(s.data)}</td><td><b>${esc(s.hora)}</b></td><td>${esc(getPatient(s.codigo).nome||s.iniciais||'Paciente')}</td><td>${esc(s.profissional||'—')}</td><td>${esc(s.modalidade||'—')}</td><td><span class="pl ${esc(s.status)}">${esc(s.status)}</span></td><td><select class="fld statusChange" data-id="${esc(s.id)}" style="min-width:130px;height:34px"><option value="">Atualizar</option>${['agendada','confirmada','realizada','faltou','cancelada'].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
function adminPatients(items){return `<div><div class="lb">GESTÃO</div><h1 style="font-size:34px;margin-top:5px">Pacientes</h1><p style="color:var(--muted);margin-top:6px">Cadastro e acesso às fichas.</p></div><div class="card card-pad"><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px"><input class="fld" id="patientFilter" placeholder="Buscar por nome, código ou telefone"><button class="b p" id="newPatientBtn2">+ Novo paciente</button></div><div class="table-wrap"><table><thead><tr><th>Paciente</th><th>Código</th><th>Telefone</th><th>E-mail</th><th>Cadastro</th><th></th></tr></thead><tbody id="patientRows">${items.map(p=>`<tr data-search="${esc((p.nome+' '+p.codigo+' '+p.telefone+' '+p.email).toLowerCase())}"><td><b>${esc(p.nome)}</b></td><td>${esc(p.codigo)}</td><td>${esc(p.telefone||'—')}</td><td>${esc(p.email||'—')}</td><td>${fmtDate((p.criadoEm||'').slice(0,10))}</td><td><button class="b s" data-open-patient="${esc(p.codigo)}">Ver perfil</button></td></tr>`).join('')}</tbody></table></div></div>`}
function adminFinance(){let charges=state.data.cobrancas||[];return `<div><div class="lb">GESTÃO</div><h1 style="font-size:34px;margin-top:5px">Financeiro</h1><p style="color:var(--muted);margin-top:6px">Cobranças, comprovantes e recebimentos por Pix.</p></div><div class="tiles">${[['Cobranças',charges.length],['Em aberto',charges.filter(c=>c.status!=='pago').length],['Pagas',charges.filter(c=>c.status==='pago').length],['Comprovantes',charges.filter(c=>c.arquivoId).length],['Total em aberto',moneyTotal(charges.filter(c=>c.status!=='pago'))]].map(([l,v])=>`<div class="card tile"><div class="lb">${l}</div><div class="d" style="font-size:26px;font-weight:700;margin-top:10px">${typeof v==='number'?v:esc(v)}</div></div>`).join('')}</div><section><h2 style="font-size:20px;margin-bottom:12px">Cobranças</h2><div class="card card-pad table-wrap"><table><thead><tr><th>Paciente</th><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Status</th></tr></thead><tbody>${charges.map(c=>`<tr><td>${esc(getPatient(c.codigo).nome||c.codigo)}</td><td>${esc(c.descricao||'')}</td><td>${fmtDate(c.vencimento)}</td><td>${esc(c.valor||'')}</td><td><span class="pl ${c.status==='pago'?'confirmada':'agendada'}">${esc(c.status)}</span></td></tr>`).join('')||'<tr><td colspan="5">Sem cobranças cadastradas.</td></tr>'}</tbody></table></div></section>`}
function moneyTotal(items){let n=items.reduce((a,c)=>a+Number(String(c.valor||'').replace(/[^0-9,.-]/g,'').replace('.','').replace(',','.')),0);return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function adminPublications(){let notices=state.data.avisos||[], materials=state.data.materiais||[];return `<div><div class="lb">GESTÃO</div><h1 style="font-size:34px;margin-top:5px">Publicações</h1><p style="color:var(--muted);margin-top:6px">Avisos e materiais enviados à área do paciente.</p></div><div class="form-grid"><form id="noticeForm" class="card card-pad"><h2 style="font-size:19px;margin-bottom:16px">Publicar aviso</h2><div class="field"><label>Título</label><input class="fld" name="titulo" required></div><div class="field" style="margin-top:12px"><label>Mensagem</label><textarea class="fld" name="mensagem" required></textarea></div><div class="field" style="margin-top:12px"><label>Enviar para</label><select class="fld" name="para"><option value="todos">Todos os pacientes</option>${(state.data.pacientes||[]).map(p=>`<option value="${esc(p.codigo)}">${esc(p.nome)}</option>`).join('')}</select></div><button class="b p" style="margin-top:14px">Publicar</button></form><form id="materialForm" class="card card-pad"><h2 style="font-size:19px;margin-bottom:16px">Enviar material</h2><div class="field"><label>Título</label><input class="fld" name="titulo" required></div><div class="field" style="margin-top:12px"><label>Descrição</label><textarea class="fld" name="descricao"></textarea></div><div class="field" style="margin-top:12px"><label>Link (opcional)</label><input class="fld" name="link" type="url"></div><div class="field" style="margin-top:12px"><label>Destinatário</label><select class="fld" name="para"><option value="todos">Todos os pacientes</option>${(state.data.pacientes||[]).map(p=>`<option value="${esc(p.codigo)}">${esc(p.nome)}</option>`).join('')}</select></div><button class="b p" style="margin-top:14px">Salvar material</button></form></div><section><h2 style="font-size:20px;margin-bottom:12px">Publicados</h2><div class="card card-pad">${notices.map(n=>`<div class="row"><div style="flex:1"><b>${esc(n.titulo)}</b><div style="color:var(--muted);font-size:13px">${esc(n.mensagem||'')} · ${fmtDate((n.criadoEm||'').slice(0,10))}</div></div></div>`).join('')}${materials.map(m=>`<div class="row"><div style="flex:1"><b>${esc(m.titulo)}</b><div style="color:var(--muted);font-size:13px">${esc(m.descricao||'')}</div></div></div>`).join('')||(!notices.length?'<div style="color:var(--muted)">Nenhum item publicado.</div>':'')}</div></section>`}
function adminClinic(){let profs=state.data.profissionais||[],availability=state.data.disponibilidade||[];return `<div><div class="lb">GESTÃO</div><h1 style="font-size:34px;margin-top:5px">Clínica e profissionais</h1><p style="color:var(--muted);margin-top:6px">Equipe e disponibilidade de atendimento.</p></div><div class="form-grid"><form id="professionalForm" class="card card-pad"><h2 style="font-size:19px;margin-bottom:16px">Cadastrar profissional</h2><div class="field"><label>Nome completo</label><input class="fld" name="nome" required></div><div class="field" style="margin-top:12px"><label>Descrição</label><textarea class="fld" name="descricao"></textarea></div><div class="field" style="margin-top:12px"><label>E-mail</label><input class="fld" name="email" type="email"></div><div class="field" style="margin-top:12px"><label>Telefone</label><input class="fld" name="telefone"></div><div class="field" style="margin-top:12px"><label>CRP</label><input class="fld" name="crp"></div><div class="field" style="margin-top:12px"><label>Serviços</label><div>${(state.data.config.servicos||[]).map(s=>`<label style="display:block;margin:6px 0;font-size:13px"><input type="checkbox" name="servicos" value="${esc(s.id)}"> ${esc(s.nome)}</label>`).join('')}</div></div><button class="b p" style="margin-top:14px">Cadastrar</button></form><form id="availabilityForm" class="card card-pad"><h2 style="font-size:19px;margin-bottom:16px">Adicionar horário disponível</h2><div class="field"><label>Profissional</label><select class="fld" name="profissional"><option value="">Todos</option>${profs.map(p=>`<option value="${esc(p.nome)}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Dia da semana</label><select class="fld" name="diaSemana"><option value="1">Segunda</option><option value="2">Terça</option><option value="3">Quarta</option><option value="4">Quinta</option><option value="5">Sexta</option><option value="6">Sábado</option><option value="0">Domingo</option></select></div><div style="display:flex;gap:12px;margin-top:12px"><div class="field"><label>Início</label><input class="fld" name="inicio" type="time" required></div><div class="field"><label>Fim</label><input class="fld" name="fim" type="time" required></div></div><button class="b p" style="margin-top:14px">Adicionar disponibilidade</button></form></div><section><h2 style="font-size:20px;margin-bottom:12px">Equipe</h2><div class="card card-pad">${profs.map(p=>`<div class="row"><span class="av" style="width:42px;height:42px;background:${esc(p.cor||'var(--accent)')}">${initials(p.nome)}</span><div style="flex:1"><b>${esc(p.nome)}</b><div style="font-size:13px;color:var(--muted)">${esc(p.descricao||'')}</div></div><span class="pl ${p.ativo==='nao'?'cancelada':'confirmada'}">${p.ativo==='nao'?'Inativo':'Ativo'}</span></div>`).join('')||'<div style="color:var(--muted)">Cadastre o primeiro profissional.</div>'}</div></section><section><h2 style="font-size:20px;margin-bottom:12px">Disponibilidade</h2><div class="card card-pad">${availability.map(a=>`<div class="row"><div style="flex:1">${['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][Number(a.diaSemana)]} · ${esc(a.inicio)}–${esc(a.fim)} · ${esc(a.profissional||'Todos')}</div></div>`).join('')||'<div style="color:var(--muted)">Nenhum horário configurado.</div>'}</div></section>`}
function bindAdminEvents(){document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view;renderAdmin()});document.getElementById('sideLogout').onclick=signOut;document.getElementById('newPatientBtn').onclick=openNewPatient;let b2=document.getElementById('newPatientBtn2');if(b2)b2.onclick=openNewPatient;document.querySelectorAll('[data-open-patient]').forEach(el=>el.onclick=()=>openPatientProfile(el.dataset.openPatient));document.querySelectorAll('[data-status]').forEach(el=>el.onclick=async()=>{try{await request('atualizarSessao',state.ctx,el.dataset.status,el.dataset.next);await loadState();toast('Sessão atualizada.')}catch(e){toast(e.message,true)}});document.querySelectorAll('[data-message-read]').forEach(el=>el.onclick=async()=>{try{await request('definirSituacao',state.ctx,el.dataset.messageRead,'lida');await loadState()}catch(e){toast(e.message,true)}});let nf=document.getElementById('newSessionBtn');if(nf)nf.onclick=openNewSession;let pf=document.getElementById('patientFilter');if(pf)pf.oninput=()=>document.querySelectorAll('#patientRows tr').forEach(r=>r.style.display=r.dataset.search.includes(pf.value.toLowerCase())?'':'none');let af=document.getElementById('agendaFilter'),sf=document.getElementById('statusFilter');function filterAgenda(){document.querySelectorAll('#agendaRows tr').forEach(r=>r.style.display=(!af.value||r.dataset.date===af.value)&&(!sf.value||r.dataset.statusValue===sf.value)?'':'none')}if(af)af.onchange=filterAgenda;if(sf)sf.onchange=filterAgenda;document.querySelectorAll('.statusChange').forEach(sel=>sel.onchange=async()=>{if(!sel.value)return;try{await request('atualizarSessao',state.ctx,sel.dataset.id,sel.value);await loadState();toast('Status atualizado.')}catch(e){toast(e.message,true)}});let search=document.getElementById('globalSearch');if(search)search.oninput=()=>{let box=document.getElementById('searchResults'),q=search.value.toLowerCase().trim();if(!q){box.style.display='none';return}let found=(state.data.pacientes||[]).filter(p=>(p.nome+' '+p.codigo+' '+p.telefone).toLowerCase().includes(q)).slice(0,6);box.innerHTML=found.map(p=>`<button class="sbl" style="color:var(--fg)" data-search-patient="${esc(p.codigo)}">${esc(p.nome)} · ${esc(p.codigo)}</button>`).join('')||'<div style="padding:10px;color:var(--muted)">Nenhum paciente encontrado</div>';box.style.display='block';box.querySelectorAll('[data-search-patient]').forEach(x=>x.onclick=()=>openPatientProfile(x.dataset.searchPatient))};bindForms()}
function bindForms(){let nf=document.getElementById('noticeForm');if(nf)nf.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(nf));try{await request('publicarAviso',state.ctx,d);toast('Aviso publicado.');await loadState()}catch(err){toast(err.message,true)}};let mf=document.getElementById('materialForm');if(mf)mf.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(mf));try{await request('salvarMaterial',state.ctx,d);toast('Material salvo.');await loadState()}catch(err){toast(err.message,true)}};let pf=document.getElementById('professionalForm');if(pf)pf.onsubmit=async e=>{e.preventDefault();let fd=new FormData(pf),d=Object.fromEntries(fd);d.servicos=fd.getAll('servicos');try{await request('salvarProfissional',state.ctx,d);toast('Profissional cadastrado.');await loadState()}catch(err){toast(err.message,true)}};let af=document.getElementById('availabilityForm');if(af)af.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(af));try{await request('salvarDisponibilidade',state.ctx,d);toast('Disponibilidade adicionada.');await loadState()}catch(err){toast(err.message,true)}}}
function showModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.add('open');document.getElementById('modalClose').onclick=closeModal;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openNewPatient(){showModal('Novo paciente',`<form id="createPatientForm" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label>Nome completo</label><input class="fld" name="nome" required></div><div class="field"><label>Telefone</label><input class="fld" name="telefone"></div><div class="field"><label>E-mail</label><input class="fld" name="email" type="email"></div><label style="font-size:13px"><input type="checkbox" name="avisos" value="true"> Autoriza avisos por e-mail</label><button class="b p">Cadastrar paciente</button></form>`);document.getElementById('createPatientForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.avisos=!!d.avisos;try{await request('salvarPaciente',state.ctx,d);closeModal();await loadState();toast('Paciente cadastrado.')}catch(err){toast(err.message,true)}}}
function openNewSession(){let patients=state.data.pacientes||[],profs=state.data.profissionais||[],services=state.data.config.servicos||[];showModal('Nova sessão',`<form id="createSessionForm" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label>Paciente</label><select class="fld" name="codigo" required><option value="">Selecione</option>${patients.map(p=>`<option value="${esc(p.codigo)}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Serviço</label><select class="fld" name="servico"><option value="">Selecione</option>${services.map(s=>`<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('')}</select></div><div class="field"><label>Profissional</label><select class="fld" name="profissional"><option value="">Selecione</option>${profs.map(p=>`<option>${esc(p.nome)}</option>`).join('')}</select></div><div style="display:flex;gap:10px"><div class="field"><label>Data</label><input class="fld" name="data" type="date" required></div><div class="field"><label>Hora</label><input class="fld" name="hora" type="time" required></div></div><div style="display:flex;gap:10px"><div class="field"><label>Duração</label><select class="fld" name="duracao"><option value="50">50 min</option><option value="60">60 min</option><option value="30">30 min</option><option value="90">90 min</option></select></div><div class="field"><label>Modalidade</label><select class="fld" name="modalidade"><option>Online</option><option>Presencial</option></select></div></div><div class="field"><label>Local ou link (opcional)</label><input class="fld" name="local"></div><button class="b p">Salvar sessão</button></form>`);document.getElementById('createSessionForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{await request('salvarSessao',state.ctx,d);closeModal();await loadState();toast('Sessão marcada.')}catch(err){toast(err.message,true)}}}
function openPatientProfile(code){let p=getPatient(code),sessions=(state.data.agenda||[]).filter(s=>s.codigo===code),f=(state.data.fichas||[]).find(x=>x.codigo===code);showModal(p.nome||'Paciente',`<div style="display:flex;flex-direction:column;gap:14px"><div class="card card-pad"><b>Código:</b> ${esc(p.codigo)}<br><b>Telefone:</b> ${esc(p.telefone||'—')}<br><b>E-mail:</b> ${esc(p.email||'—')}</div><h3>Próximas sessões</h3>${sessions.map(s=>`<div class="row"><div style="flex:1">${fmtDate(s.data)} às ${esc(s.hora)} · ${esc(s.profissional||'')}</div><span class="pl ${esc(s.status)}">${esc(s.status)}</span></div>`).join('')||'<p>Nenhuma sessão.</p>'}<h3>Ficha cadastral</h3>${f?`<pre style="white-space:pre-wrap;font:13px Manrope,sans-serif;background:#f5f0e8;padding:12px;border-radius:10px">${esc(JSON.stringify(f.dados,null,2))}</pre>`:'<p>Ficha não preenchida.</p>'}</div>`)}
function renderPatient(){let d=state.data,p=d.perfil||{},code=p.codigo;let tab=state.patientTab||'sessoes';document.getElementById('app').innerHTML=`<div style="max-width:1160px;margin:0 auto;padding:0 40px 56px"><header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-height:76px;border-bottom:1px solid var(--border)"><div class="d" style="font-size:24px;font-weight:700">emotiss<span style="color:var(--accent)">.</span></div><nav class="patient-nav" aria-label="Seções"><button data-patient-tab="sessoes" class="${tab==='sessoes'?'active':''}">Minhas sessões</button><button data-patient-tab="documentos" class="${tab==='documentos'?'active':''}">Documentos</button><button data-patient-tab="avisos" class="${tab==='avisos'?'active':''}">Avisos</button><button data-patient-tab="perfil" class="${tab==='perfil'?'active':''}">Minha ficha</button></nav><button class="b s" id="patientLogout">Sair</button></header><div style="padding:34px 0 0"><h1 style="font-size:36px">Olá, ${esc((p.nome||'').split(' ')[0]||'') }</h1><div style="color:var(--muted);font-size:14px;margin-top:5px">Seu código ${esc(code||'')} · ${esc(d.config?.clinica||'SiAGE | Emotiss')}</div></div><div style="margin-top:28px">${tab==='sessoes'?patientSessions():tab==='documentos'?patientDocuments():tab==='avisos'?patientNotices():patientProfile()}</div></div>`;document.querySelectorAll('[data-patient-tab]').forEach(b=>b.onclick=()=>{state.patientTab=b.dataset.patientTab;renderPatient()});document.getElementById('patientLogout').onclick=signOut;document.querySelectorAll('[data-cancel-session]').forEach(b=>b.onclick=async()=>{if(!confirm('Deseja cancelar esta sessão?'))return;try{await request('cancelarSessao',state.ctx,b.dataset.cancelSession);await loadState();toast('Solicitação concluída.')}catch(e){toast(e.message,true)}});document.getElementById('bookSessionBtn')?.addEventListener('click',openPatientBooking);document.getElementById('patientMessageForm')?.addEventListener('submit',submitPatientMessage);document.getElementById('patientFichaForm')?.addEventListener('submit',submitPatientFicha);document.querySelectorAll('[data-get-file]').forEach(b=>b.onclick=()=>downloadFile(b.dataset.getFile));}
function patientSessions(){let d=state.data,up=(d.agenda||[]).filter(x=>['agendada','confirmada'].includes(x.status)).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)),services=d.config?.servicos||[];return `<div style="display:flex;gap:30px;flex-wrap:wrap;align-items:flex-start"><main style="flex:999 1 560px;display:flex;flex-direction:column;gap:24px"><section class="card" style="background:var(--dark);color:var(--bg);padding:24px 28px;border-radius:20px"><div class="lb" style="color:var(--gold)">PRÓXIMOS PASSOS</div><h2 style="font-size:23px;margin-top:8px">${state.data.ficha?'Seu espaço está pronto':'Complete sua ficha para começar'}</h2><p style="margin-top:8px;color:#cdc5b6;line-height:1.6">${state.data.ficha?'Acompanhe suas sessões, avisos e documentos por aqui.':'Preencha sua ficha cadastral antes de agendar.'}</p><button class="b p" id="bookSessionBtn" style="margin-top:18px">Agendar sessão →</button></section><section><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:10px"><h2 style="font-size:20px">Próximas sessões</h2></div><div class="card card-pad" style="margin-top:12px">${up.map(s=>`<div class="row"><div style="width:60px;height:62px;border-radius:14px;background:#f2e5d9;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center"><b>${(s.data||'').slice(8,10)}</b><span style="font-size:11px">${(s.data||'').slice(5,7)}</span></div><div style="flex:1"><b>${fmtDate(s.data)} · ${esc(s.hora)}</b><div style="font-size:13px;color:var(--muted)">${esc(s.servico||'Atendimento')} · ${esc(s.modalidade||'')} · ${esc(s.profissional||'')}</div></div><span class="pl ${esc(s.status)}">${esc(s.status)}</span><button class="b s r" data-cancel-session="${esc(s.id)}">Cancelar</button></div>`).join('')||'<div style="color:var(--muted)">Você ainda não tem sessões próximas.</div>'}</div></section><section><h2 style="font-size:20px;margin-bottom:12px">Avisos da clínica</h2><div class="card card-pad">${(d.avisos||[]).slice(0,3).map(n=>`<div class="row"><div><b>${esc(n.titulo)}</b><p style="font-size:13px;color:var(--muted);margin-top:4px">${esc(n.mensagem||'')}</p></div></div>`).join('')||'<div style="color:var(--muted)">Nenhum aviso novo.</div>'}</div></section></main><aside style="flex:1 1 260px;display:flex;flex-direction:column;gap:16px"><div class="card card-pad"><div class="lb">SEU CADASTRO</div><div style="margin-top:10px"><b>${esc(state.data.perfil?.nome||'')}</b><div style="font-size:13px;color:var(--muted);margin-top:3px">${esc(state.data.perfil?.email||'')}</div><div style="font-size:13px;color:var(--muted)">${esc(state.data.perfil?.telefone||'')}</div></div></div><div class="card card-pad"><div class="lb">DOCUMENTOS RECENTES</div>${(d.materiais||[]).slice(0,3).map(m=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><b style="font-size:13px">${esc(m.titulo)}</b></div>`).join('')||'<div style="font-size:13px;color:var(--muted);margin-top:10px">Nenhum documento.</div>'}<button class="b s" data-patient-tab="documentos" style="margin-top:12px">Ver documentos</button></div></aside></div>`}
function patientDocuments(){let d=state.data;return `<div><h2 style="font-size:24px;margin-bottom:16px">Documentos e materiais</h2><div class="card card-pad">${(d.materiais||[]).map(m=>`<div class="row"><div style="flex:1"><b>${esc(m.titulo)}</b><div style="font-size:13px;color:var(--muted)">${esc(m.descricao||'')} · ${fmtDate((m.criadoEm||'').slice(0,10))}</div></div>${m.arquivoId?`<button class="b s" data-get-file="${esc(m.arquivoId)}">Baixar</button>`:''}${m.link?`<a class="b s" href="${esc(m.link)}" target="_blank" rel="noopener">Abrir link</a>`:''}</div>`).join('')||'<div style="color:var(--muted)">Nenhum documento disponível.</div>'}</div><h2 style="font-size:24px;margin:28px 0 16px">Cobranças</h2><div class="card card-pad">${(d.cobrancas||[]).map(c=>`<div class="row"><div style="flex:1"><b>${esc(c.descricao||'Cobrança')}</b><div style="font-size:13px;color:var(--muted)">Vencimento ${fmtDate(c.vencimento)} · ${esc(c.valor||'')}</div></div><span class="pl ${c.status==='pago'?'confirmada':'agendada'}">${esc(c.status)}</span>${c.arquivoId?`<button class="b s" data-get-file="${esc(c.arquivoId)}">Comprovante</button>`:''}</div>`).join('')||'<div style="color:var(--muted)">Nenhuma cobrança disponível.</div>'}</div></div>`}
function patientNotices(){return `<h2 style="font-size:24px;margin-bottom:16px">Avisos da clínica</h2><div class="card card-pad">${(state.data.avisos||[]).map(n=>`<div class="row"><div><b>${esc(n.titulo)}</b><p style="font-size:14px;color:var(--muted);margin-top:5px">${esc(n.mensagem||'')}</p><span style="font-size:11px;color:#8d8477">${fmtDate((n.criadoEm||'').slice(0,10))}</span></div></div>`).join('')||'<div style="color:var(--muted)">Nenhum aviso.</div>'}</div>`}
function patientProfile(){let ficha=state.data.ficha?.dados||{};return `<div style="max-width:780px"><h2 style="font-size:24px;margin-bottom:8px">Ficha cadastral</h2><p style="color:var(--muted);margin-bottom:18px">Suas informações ficam protegidas e são usadas para organizar o atendimento.</p>${state.data.ficha?`<div class="card card-pad"><div class="row"><div style="flex:1"><b>${esc(ficha.paciente||state.data.perfil?.nome)}</b><div style="font-size:13px;color:var(--muted)">Ficha enviada ${fmtDate((state.data.ficha.atualizadoEm||state.data.ficha.criadoEm||'').slice(0,10))}</div></div><span class="pl confirmada">Recebida</span></div><div style="margin-top:14px"><b>Queixa principal</b><p style="color:var(--muted);margin-top:4px">${esc(ficha.demanda||'—')}</p></div></div>`:`<form id="patientFichaForm" class="card card-pad" style="display:flex;flex-direction:column;gap:14px"><div class="field"><label>Nome completo</label><input class="fld" name="paciente" value="${esc(state.data.perfil?.nome||'')}" required></div><div class="form-grid"><div class="field"><label>Data de nascimento</label><input class="fld" name="nascimento" type="date"></div><div class="field"><label>Telefone</label><input class="fld" name="telefone" value="${esc(state.data.perfil?.telefone||'')}"></div><div class="field"><label>E-mail</label><input class="fld" name="email" type="email" value="${esc(state.data.perfil?.email||'')}"></div><div class="field"><label>Serviço de interesse</label><select class="fld" name="servico"><option value="">Selecione</option>${(state.data.config.servicos||[]).map(s=>`<option value="${esc(s.nome)}">${esc(s.nome)}</option>`).join('')}</select></div><div class="field full"><label>Queixa principal / motivo da busca</label><textarea class="fld" name="demanda" required></textarea></div></div><label style="display:flex;gap:9px;font-size:13px;align-items:flex-start"><input type="checkbox" name="lgpd" value="SIM" required> Li e autorizo o uso dos meus dados para organização do atendimento, conforme a LGPD.</label><button class="b p" style="align-self:flex-start">Enviar ficha</button></form>`}</div>`}
function submitPatientFicha(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.lgpd=d.lgpd?'SIM':'';request('salvarFicha',state.ctx,d).then(()=>{toast('Ficha enviada.');return loadState()}).catch(e=>toast(e.message,true))}
function submitPatientMessage(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));request('enviarMensagem',state.ctx,d).then(()=>{toast('Mensagem enviada à equipe.');loadState()}).catch(e=>toast(e.message,true))}
async function openPatientBooking(){let services=state.data.config?.servicos||[],profs=state.data.profissionais||[];showModal('Agendar sessão',`<form id="bookingForm" style="display:flex;flex-direction:column;gap:12px"><div class="field"><label>Serviço</label><select class="fld" id="bookingService" name="servico" required><option value="">Escolha o serviço</option>${services.map(s=>`<option value="${esc(s.id)}">${esc(s.nome)}</option>`).join('')}</select></div><div class="field"><label>Profissional</label><select class="fld" id="bookingProfessional" name="profissional"><option value="">Selecione (se necessário)</option>${profs.map(p=>`<option value="${esc(p.nome)}">${esc(p.nome)}</option>`).join('')}</select></div><div class="field"><label>Modalidade</label><select class="fld" name="modalidade"><option>Online</option><option>Presencial</option></select></div><div class="field"><label>Data</label><select class="fld" id="bookingDate" name="data" required disabled><option value="">Escolha primeiro o serviço</option></select></div><div class="field"><label>Horário</label><select class="fld" id="bookingTime" name="hora" required disabled><option value="">Escolha a data</option></select></div><label style="font-size:12px;line-height:1.5"><input type="checkbox" name="aceite" value="yes" required> Confirmo que li as informações do serviço e aceito as condições para solicitar o agendamento.</label><button class="b p">Confirmar agendamento</button></form>`);let service=document.getElementById('bookingService'),professional=document.getElementById('bookingProfessional'),date=document.getElementById('bookingDate'),time=document.getElementById('bookingTime');async function updateDates(){date.innerHTML='<option>Carregando horários…</option>';date.disabled=true;time.innerHTML='<option value="">Escolha a data</option>';time.disabled=true;if(!service.value)return;try{let slots=await request('getHorarios',state.ctx,service.value,professional.value);let dates=Object.keys(slots).filter(k=>slots[k].length).sort();date.innerHTML='<option value="">Selecione uma data</option>'+dates.map(k=>`<option value="${k}">${fmtDate(k)} · ${slots[k].length} horários</option>`).join('');date.disabled=false;date.dataset.slots=JSON.stringify(slots)}catch(err){date.innerHTML='<option value="">Não foi possível carregar os horários</option>';toast(err.message,true)}}service.onchange=updateDates;professional.onchange=()=>service.value&&updateDates();date.onchange=()=>{let slots=JSON.parse(date.dataset.slots||'{}');let times=slots[date.value]||[];time.innerHTML='<option value="">Selecione um horário</option>'+times.map(h=>`<option>${h}</option>`).join('');time.disabled=!times.length};document.getElementById('bookingForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.aceite=!!d.aceite;try{await request('agendarSessao',state.ctx,d);closeModal();await loadState();toast('Sessão agendada.')}catch(err){toast(err.message,true)}}}
async function downloadFile(id){try{let r=await request('baixarArquivo',state.ctx,id);let a=document.createElement('a');a.href='data:'+r.mime+';base64,'+r.base64;a.download=r.nome||'arquivo';a.click()}catch(e){toast(e.message,true)}}
function bindPatientMessages(){let f=document.getElementById('patientMessageForm');if(f)f.onsubmit=submitPatientMessage}
function boot(){document.getElementById('modalClose').onclick=closeModal;readSession();if(state.ctx)loadState();else renderLogin()}
boot();


</script>
</body>
</html>
